<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD1 Vocabulaire</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 1</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 3 — Vocabulaire</div><h1>TD 1 — Vocabulaire & expressions difficile</h1><p class="muted">30 QCM : registres, expressions idiomatiques, paronymes, faux synonymes, intensités lexicales et culture de langue.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Difficile</span><span class="tag">ESSEC</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['“Faire fi de” signifie :',['tenir compte de','mépriser ou ignorer','expliquer clairement','attendre patiemment'],'mépriser ou ignorer','Faire fi de quelque chose signifie ne pas en tenir compte.'],['Le mot soutenu pour “gronder” est :',['admonester','acclamer','amadouer','ajourner'],'admonester','Admonester signifie réprimander avec gravité.'],['“Collision” ne doit pas être confondu avec :',['collusion','conclusion','coalition','cohésion'],'collusion','Collision = choc ; collusion = entente secrète.'],['Quel mot est le plus fort ?',['critiquer','blâmer','vilipender','nuancer'],'vilipender','Vilipender signifie critiquer violemment, souvent publiquement.'],['“Être en butte à” signifie :',['être protégé par','subir des attaques','renoncer à','être indifférent à'],'subir des attaques','Expression soutenue : être exposé à des critiques ou attaques.'],['“Partial” signifie :',['incomplet','partisan','précis','total'],'partisan','Partial = qui manque d’objectivité ; partiel = incomplet.'],['“Mettre la charrue avant les bœufs” signifie :',['agir trop lentement','agir dans le mauvais ordre','être prudent','abandonner'],'agir dans le mauvais ordre','L’expression signale une inversion des étapes logiques.'],['Quel mot appartient au registre familier ?',['se sustenter','manger','bouffer','ingérer'],'bouffer','Bouffer est familier ; se sustenter est soutenu.'],['“Péremptoire” signifie :',['catégorique','hésitant','mélancolique','incomplet'],'catégorique','Une affirmation péremptoire est tranchée, parfois excessive.'],['“Tartufferie” renvoie à :',['l’hypocrisie','la bravoure','la rapidité','la pauvreté'],'l’hypocrisie','Référence à Tartuffe : fausse dévotion, hypocrisie morale.'],['Antonyme de “laconique” :',['bref','prolixe','clair','calme'],'prolixe','Laconique = très bref ; prolixe = trop long.'],['“Noyer le poisson” signifie :',['expliquer précisément','embrouiller volontairement','échouer','réussir de peu'],'embrouiller volontairement','Expression de diversion argumentative.'],['“Éminent” signifie :',['proche','remarquable','urgent','caché'],'remarquable','Éminent = remarquable ; imminent = proche dans le temps.'],['Quel mot est péjoratif ?',['économe','prudent','avare','mesuré'],'avare','Avare ajoute une connotation négative.'],['“Ubuesque” signifie :',['logique','absurde et grotesque','poétique','concis'],'absurde et grotesque','Référence à Ubu : ridicule, absurde, grotesque.'],['“Conjecture” signifie :',['hypothèse','situation économique','certitude','discours'],'hypothèse','Conjecture = supposition ; conjoncture = situation.'],['“Jeter l’opprobre” signifie :',['féliciter','couvrir de honte','rassurer','réparer'],'couvrir de honte','Opprobre = honte publique.'],['Lequel est le plus intense ?',['inquiétude','crainte','effroi','réserve'],'effroi','Effroi est plus fort que crainte et inquiétude.'],['“Compréhensif” signifie :',['clair','indulgent','complexe','bavard'],'indulgent','Compréhensible = clair ; compréhensif = indulgent.'],['“Donner le change” signifie :',['payer','tromper les apparences','réparer','échanger'],'tromper les apparences','Expression liée à la dissimulation.'],['“Mansuétude” signifie :',['indulgence','honte','peur','violence'],'indulgence','Mansuétude = douceur indulgente.'],['Quel mot est un barbarisme fréquent ?',['pallier une difficulté','résoudre un problème','pallier à une difficulté','corriger une erreur'],'pallier à une difficulté','On dit pallier quelque chose, sans “à”.'],['“Faire long feu” signifie :',['durer longtemps','échouer','réussir vite','attendre longtemps'],'échouer','Faire long feu = ne pas produire l’effet attendu.'],['“Caustique” qualifie un ton :',['mordant','faible','lent','neutre'],'mordant','Caustique = ironique et blessant.'],['“Inique” signifie :',['injuste','inutile','inquiet','incomplet'],'injuste','Inique = profondément injuste.'],['“Prêcher dans le désert” signifie :',['convaincre tout le monde','parler sans être entendu','se taire','mentir'],'parler sans être entendu','Expression d’inefficacité du discours.'],['Quel mot est trop fort pour une simple réserve ?',['nuancer','contester','vilipender','discuter'],'vilipender','Vilipender implique une attaque très violente.'],['“Orwellien” évoque surtout :',['la surveillance et manipulation','la générosité','la poésie','la rapidité'],'la surveillance et manipulation','Référence à Orwell : contrôle, surveillance, langage politique.'],['“Allocation” ne doit pas être confondu avec :',['allocution','adoption','allusion','illusion'],'allocution','Allocation = somme attribuée ; allocution = discours.'],['“Tirer son épingle du jeu” signifie :',['échouer','réussir malgré les difficultés','tricher','renoncer'],'réussir malgré les difficultés','Expression positive de réussite dans une situation difficile.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
