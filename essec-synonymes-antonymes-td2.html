<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PrepOral — TD2 Synonymes & Antonymes</title><style>body{margin:0;background:linear-gradient(180deg,#ece3d4,#dfd2bf);font-family:Inter,sans-serif;color:#17130f}.wrap{max-width:1050px;margin:auto;padding:42px 22px}.hero,.q{background:#f8f0e4;border:1px solid #cdbba3;border-radius:24px;box-shadow:0 16px 38px rgba(60,42,25,.09)}.hero{padding:34px;border-top:6px solid #6b705c;margin-bottom:26px}.hero h1{font-size:3rem;margin:12px 0}.hero p,.q p{color:#6d6258;line-height:1.7}.q{padding:24px;margin-bottom:18px}.num{display:inline-block;background:#991b1b;color:white;padding:6px 10px;border-radius:10px;font-weight:900;margin-bottom:10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.opt{background:#fbf3e7;border:1px solid #cdbba3;border-radius:999px;padding:12px;color:#6d6258}.corr{margin-top:14px;padding:14px;border-left:4px solid #0f766e;background:rgba(15,118,110,.08);border-radius:14px;color:#17473f}</style></head><body><main class="wrap"><div class="hero"><div style="font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#991b1b;font-weight:900">Section 2 — Verbal · Chapitre 1</div><h1>TD 2 — Niveau très difficile</h1><p>Ce TD reproduit les pièges ESSEC les plus exigeants : nuances fines, faux synonymes, intensités proches et antonymes contextuels.</p></div><script>const qs=[['Synonyme de “abscons”','logique','obscur','ancien','violent','B','Abscons signifie difficile à comprendre.'],['Antonyme de “paradoxal”','évident','cohérent','rationnel','prévisible','B','Paradoxal s’oppose ici à cohérent.'],['Synonyme de “obtempérer”','résister','obéir','anticiper','renoncer','B','Obtempérer signifie se soumettre à un ordre.'],['Antonyme de “fastidieux”','rapide','passionnant','simple','fluide','B','Fastidieux désigne quelque chose d’ennuyeux et pénible.'],['Synonyme de “péremptoire”','nuancé','catégorique','secret','bruyant','B','Péremptoire signifie affirmé avec autorité excessive.'],['Antonyme de “altruiste”','ambitieux','égoïste','violent','fier','B','Altruiste s’oppose à égoïste.'],['Synonyme de “équanime”','impartial','prudent','rigoureux','discret','A','Équanime désigne une personne calme et juste.'],['Antonyme de “velléitaire”','déterminé','rapide','brutal','spontané','A','Velléitaire désigne quelqu’un qui manque de volonté concrète.'],['Synonyme de “fallacieux”','ambigu','trompeur','profond','excessif','B','Fallacieux signifie trompeur malgré une apparence logique.'],['Antonyme de “prolixe”','synthétique','timide','laconique','calme','C','Prolixe = trop bavard ; laconique = très concis.'],['Synonyme de “apathique”','paisible','sans énergie','méfiant','modéré','B','Apathique signifie sans réaction ni énergie.'],['Antonyme de “inébranlable”','fragile','instable','hésitant','flexible','C','Inébranlable s’oppose ici à hésitant.'],['Synonyme de “caustique”','subtil','ironique et mordant','violent','rapide','B','Un ton caustique est ironique et blessant.'],['Antonyme de “docile”','rebelle','dangereux','bruyant','indiscipliné','A','Docile signifie facile à diriger ou à contrôler.'],['Synonyme de “inanité”','faiblesse','absurdité vide','complexité','modération','B','Inanité désigne le caractère vide ou absurde.']];document.write(qs.map((q,i)=>`<div class='q'><div class='num'>${i+1}</div><p><b>${q[0]}</b></p><div class='opts'><div class='opt'>A. ${q[1]}</div><div class='opt'>B. ${q[2]}</div><div class='opt'>C. ${q[3]}</div><div class='opt'>D. ${q[4]}</div></div><div class='corr'><b>Réponse : ${q[5]}</b><br>${q[6]}</div></div>`).join(''))</script></main></body></html>
