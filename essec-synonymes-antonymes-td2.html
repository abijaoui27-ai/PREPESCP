<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="format-detection" content="telephone=no"><title>PrepOral — TD2 Synonymes et antonymes</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0055b3;--blue2:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px;position:relative}.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#003b7a,#0072e5)}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue2);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.panel{padding:22px 28px;margin-bottom:13px}.panel h2{font-family:'Cormorant Garamond',serif;font-size:1.38rem;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;letter-spacing:.02em;margin-bottom:10px;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 2</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 1 — Synonymes & antonymes</div><h1>TD 2 — Très difficile</h1><p class="muted">30 QCM très sélectifs : vocabulaire soutenu, antonymes piégeux, paronymes rares, connotations et nuances fines.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Très difficile</span><span class="tag">Verbal ESSEC</span></div></section><section class="panel"><h2>Questions</h2><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l’espace psychotechnique</a></section></main><script>const DATA=[['“Obvie” signifie :',['caché','évident','inutile','fragile'],'évident','Obvie signifie manifeste, évident, mais reste d’un registre soutenu.'],['Antonyme de “abscons” ?',['limpide','complexe','profond','rare'],'limpide','Abscons signifie obscur, difficile à comprendre ; limpide est le contraire exact.'],['Meilleur synonyme de “acrimonieux” ?',['amer','bref','joyeux','lent'],'amer','Acrimonieux qualifie un ton plein d’amertume agressive.'],['Paronyme : “substantiel” signifie :',['de même nature','important et consistant','très secret','sans substance'],'important et consistant','Substantiel = important, consistant ; consubstantiel = de même substance.'],['“Sibyllin” qualifie un propos :',['clair','obscur','injurieux','bavard'],'obscur','Un propos sibyllin est énigmatique, difficile à interpréter.'],['Antonyme de “péremptoire” ?',['hésitant','autoritaire','rapide','brutal'],'hésitant','Péremptoire signifie catégorique ; hésitant est ici le meilleur opposé.'],['Meilleur synonyme de “cauteleux” ?',['rusé et méfiant','généreux','bruyant','mou'],'rusé et méfiant','Cauteleux suggère une prudence rusée, parfois sournoise.'],['Intrus lexical :',['morbide','macabre','funèbre','hilare'],'hilare','Hilare appartient au champ de la joie, les autres au sombre et à la mort.'],['“Dilatoire” signifie :',['qui retarde','qui explique','qui condamne','qui résume'],'qui retarde','Une manœuvre dilatoire vise à gagner du temps.'],['Antonyme contextuel de “vindicatif” ?',['clément','violent','méfiant','hargneux'],'clément','Vindicatif = porté à la vengeance ; clément = disposé au pardon.'],['Meilleur synonyme de “idiosyncrasie” ?',['particularité propre','maladie grave','contradiction','imitation'],'particularité propre','L’idiosyncrasie est une disposition particulière propre à un individu ou groupe.'],['Paronyme : “prodigue” signifie :',['extraordinaire','dépensier ou généreux','très jeune','prudent'],'dépensier ou généreux','Prodigue ≠ prodige. Le prodigue dépense largement ou donne beaucoup.'],['“Atermoyer” signifie :',['remettre à plus tard','attaquer','nier','définir'],'remettre à plus tard','Atermoyer signifie différer, gagner du temps.'],['Antonyme de “déférent” ?',['irrespectueux','servile','attentif','aimable'],'irrespectueux','Déférent = respectueux ; irrespectueux est l’opposé.'],['Meilleur synonyme de “exsangue” ?',['affaibli','sanglant','bruyant','étroit'],'affaibli','Exsangue signifie vidé de ses forces, très affaibli.'],['“Immanent” signifie :',['extérieur','contenu dans la chose même','proche dans le temps','illusoire'],'contenu dans la chose même','Immanent s’oppose à transcendant : présent à l’intérieur même d’une réalité.'],['Antonyme de “lénifiant” ?',['alarmant','calmant','doux','rassurant'],'alarmant','Lénifiant apaise ; alarmant inquiète.'],['Meilleur synonyme de “melliflu” ?',['doucereux','cassant','obscur','violent'],'doucereux','Melliflu qualifie une douceur excessive, souvent affectée.'],['Intrus :',['fallacieux','spécieux','trompeur','probe'],'probe','Probe signifie honnête ; les autres renvoient à la tromperie.'],['“Turpitude” signifie :',['bassesse morale','rapidité','fatigue','pauvreté'],'bassesse morale','La turpitude désigne une faute morale honteuse.'],['Antonyme de “versatile” ?',['constant','changeant','souple','instable'],'constant','Versatile signifie changeant, instable.'],['Meilleur synonyme de “anodin” ?',['insignifiant','dangereux','ancien','soutenu'],'insignifiant','Anodin signifie sans gravité, sans importance.'],['Paronyme : “inclination” désigne plutôt :',['une disposition affective','une pente physique','une correction','un soupçon'],'une disposition affective','Inclination = penchant, disposition ; inclinaison = position penchée.'],['“Mansuétude” signifie :',['douceur indulgente','violence','mépris','précision'],'douceur indulgente','La mansuétude est une indulgence bienveillante.'],['Antonyme de “diaphane” ?',['opaque','pâle','clair','translucide'],'opaque','Diaphane évoque une transparence légère ; opaque est l’opposé.'],['Meilleur synonyme de “commisération” ?',['pitié','admiration','colère','vanité'],'pitié','La commisération est une pitié compatissante.'],['“Obsolète” signifie :',['dépassé','ancien mais utile','sacré','fragile'],'dépassé','Obsolète = qui n’est plus en usage, dépassé.'],['Antonyme de “pusillanime” ?',['audacieux','timoré','prudent','calme'],'audacieux','Pusillanime = peureux ; audacieux est l’opposé.'],['Meilleur synonyme de “inanité” ?',['vacuité','intensité','rigueur','clarté'],'vacuité','Inanité = vide, absence de valeur ou de sens.'],['“Rédhibitoire” signifie :',['qui empêche définitivement','qui corrige','qui apaise','qui explique'],'qui empêche définitivement','Un défaut rédhibitoire rend une chose inacceptable ou impossible.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><div class="qtop"><span class="num">Question ${i+1}</span></div><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
