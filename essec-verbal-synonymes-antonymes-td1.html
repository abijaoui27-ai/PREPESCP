<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Synonymes & Antonymes</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.05rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 1</span><h1>TD 1 — Niveau 1</h1><p class="muted">QCM moyen/difficile : synonymes, antonymes, nuances et premiers pièges de vocabulaire.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[['Synonyme le plus proche de « vilipender ».',['Critiquer violemment','Encourager','Observer','Imiter'],'Critiquer violemment','Vilipender signifie attaquer verbalement avec dureté.'],['Antonyme le plus précis de « intègre ».',['Rusé','Corrompu','Modeste','Sévère'],'Corrompu','Intègre renvoie à la probité morale.'],['« Délétère » signifie :',['Nuisible','Rare','Fragile','Complexe'],'Nuisible','Délétère qualifie ce qui produit un effet toxique ou nocif.'],['Antonyme de « lugubre ».',['Gai','Calme','Sérieux','Discret'],'Gai','Lugubre renvoie à une atmosphère sombre et triste.'],['Synonyme de « plausible ».',['Crédible','Certain','Évident','Prévisible'],'Crédible','Plausible signifie vraisemblable, possible à croire.'],['« Atermoiement » signifie :',['Retard volontaire','Élan soudain','Colère brève','Accord tacite'],'Retard volontaire','C’est une manière de différer une décision.'],['Synonyme de « assidu ».',['Régulier','Brillant','Rapide','Curieux'],'Régulier','Assidu signifie présent et constant dans l’effort.'],['Antonyme de « parcimonieux ».',['Prodigue','Prudent','Pauvre','Méfiant'],'Prodigue','Parcimonieux = très économe ; prodigue = dépensier/généreux à l’excès.'],['« Volubile » désigne quelqu’un qui :',['Parle beaucoup','Ment souvent','Change d’avis','Rit facilement'],'Parle beaucoup','Volubile qualifie une parole abondante et rapide.'],['Synonyme de « subterfuge ».',['Ruse','Discours','Retard','Regret'],'Ruse','Un subterfuge est un moyen détourné pour se tirer d’affaire.'],['Antonyme de « apaiser ».',['Enflammer','Renforcer','Dissimuler','Ralentir'],'Enflammer','Apaiser = calmer une tension ; enflammer = raviver la tension.'],['« Éhonté » signifie :',['Sans honte','Très triste','Très habile','Sans force'],'Sans honte','Éhonté qualifie une attitude impudente.'],['Synonyme de « exigu ».',['Étroit','Éloigné','Sombre','Vide'],'Étroit','Exigu qualifie un espace très réduit.'],['Antonyme de « prodigieux ».',['Banal','Dangereux','Lent','Ancien'],'Banal','Prodigieux = extraordinaire ; banal = commun.'],['« Entregent » signifie :',['Aisance relationnelle','Courage physique','Mémoire précise','Méfiance excessive'],'Aisance relationnelle','L’entregent est l’aptitude à nouer des relations utiles.'],['Synonyme de « irascible ».',['Coléreux','Indécis','Mélancolique','Discret'],'Coléreux','Irascible = qui s’emporte facilement.'],['Antonyme de « subordination ».',['Indépendance','Indifférence','Obéissance','Tolérance'],'Indépendance','Subordination = dépendance hiérarchique.'],['« Fallacieux » signifie :',['Trompeur','Vulgaire','Brutal','Lointain'],'Trompeur','Un raisonnement fallacieux induit en erreur.'],['Synonyme de « morigéner ».',['Réprimander','Consoler','Résumer','Permettre'],'Réprimander','Morigéner = reprendre sévèrement.'],['Antonyme de « versatile ».',['Constant','Timide','Brillant','Optimiste'],'Constant','Versatile = changeant, inconstant.'],['« Superfétatoire » signifie :',['Inutilement ajouté','Très précieux','Trop rapide','Facilement cassable'],'Inutilement ajouté','Superfétatoire = superflu, non nécessaire.'],['Synonyme de « dissension ».',['Désaccord','Récompense','Souvenir','Compassion'],'Désaccord','Une dissension est un désaccord interne ou profond.'],['Antonyme de « dénigrer ».',['Valoriser','Analyser','Comparer','Éviter'],'Valoriser','Dénigrer = rabaisser ; valoriser/flatter = mettre en valeur.'],['« Caustique » signifie souvent :',['Mordant','Craintif','Confus','Docile'],'Mordant','Caustique qualifie une ironie piquante.'],['Synonyme de « commisération ».',['Compassion','Mépris','Jalousie','Précipitation'],'Compassion','Commisération = pitié, compassion envers autrui.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong><br>${q[3]}</div></details></div>`).join('');</script></body></html>
