<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="format-detection" content="telephone=no"><title>PrepOral — TD1 Synonymes et antonymes</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0055b3;--blue2:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px;position:relative}.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#003b7a,#0072e5)}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue2);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.panel{padding:22px 28px;margin-bottom:13px}.panel h2{font-family:'Cormorant Garamond',serif;font-size:1.38rem;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;letter-spacing:.02em;margin-bottom:10px;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 1</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 1 — Synonymes & antonymes</div><h1>TD 1 — Précision lexicale difficile</h1><p class="muted">30 QCM niveau ESSEC : synonymes, antonymes contextuels, nuances, paronymes et choix du mot exact.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Difficile</span><span class="tag">Verbal ESSEC</span></div></section><section class="panel"><h2>Questions</h2><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l’espace psychotechnique</a></section></main><script>const DATA=[['Meilleur synonyme de “pusillanime” ?',['courageux','timoré','généreux','grave'],'timoré','Pusillanime signifie qui manque de courage.'],['Antonyme contextuel de “explicite” ?',['implicite','faux','bref','obscur'],'implicite','Explicite s’oppose directement à implicite.'],['“Spécieux” signifie :',['très précis','séduisant mais trompeur','violent','sans intérêt'],'séduisant mais trompeur','Un raisonnement spécieux paraît juste mais induit en erreur.'],['Intrus lexical :',['laconique','concis','prolixe','lapidaire'],'prolixe','Prolixe signifie trop long ; les autres renvoient à la brièveté.'],['Meilleur synonyme de “vilipender” ?',['féliciter','conspuer','réparer','observer'],'conspuer','Vilipender signifie critiquer avec violence.'],['Antonyme de “conciliant” ?',['intransigeant','aimable','hostile','calme'],'intransigeant','Conciliant accepte le compromis ; intransigeant le refuse.'],['Paronyme correct : une entente secrète est une...',['collision','collusion','conjecture','conjoncture'],'collusion','Collusion = entente secrète ; collision = choc.'],['Meilleur synonyme de “fétide” ?',['méphitique','limpide','diaphane','placide'],'méphitique','Les deux renvoient à une odeur infecte.'],['Antonyme de “lacunaire” ?',['exhaustif','provisoire','partiel','confus'],'exhaustif','Lacunaire contient des manques ; exhaustif couvre tout.'],['“Éminent” signifie :',['proche','remarquable','urgent','imminent'],'remarquable','Éminent = remarquable ; imminent = sur le point d’arriver.'],['Meilleur synonyme de “outrecuidant” ?',['prudent','présomptueux','affable','indolent'],'présomptueux','Outrecuidant désigne une assurance insolente.'],['Antonyme contextuel de “ferme” dans “une décision ferme” ?',['molle','hésitante','liquide','fragile'],'hésitante','Ici ferme signifie résolue.'],['“Dithyrambique” signifie :',['très critique','excessivement élogieux','confus','très bref'],'excessivement élogieux','Un éloge dithyrambique est très laudatif.'],['Intrus :',['macabre','funèbre','lugubre','affable'],'affable','Affable appartient au champ de l’amabilité, pas du sombre.'],['Meilleur synonyme de “oiseux” ?',['utile','vain','solide','bruyant'],'vain','Oiseux signifie inutile, sans portée.'],['Antonyme de “provisoire” ?',['définitif','temporaire','précaire','fragile'],'définitif','Provisoire s’oppose à définitif.'],['“Velléitaire” désigne quelqu’un qui...',['agit vite','veut sans agir','pardonne facilement','parle peu'],'veut sans agir','Le velléitaire a une volonté faible ou non suivie d’actes.'],['Paronyme : une hypothèse fragile est une...',['conjoncture','conjecture','collusion','illusion'],'conjecture','Conjecture = supposition ; conjoncture = situation.'],['Meilleur synonyme de “réticent” ?',['hésitant','joyeux','hautain','faux'],'hésitant','Réticent signifie réservé, qui hésite à dire ou à faire.'],['Antonyme de “ostensiblement” ?',['ouvertement','discrètement','brutalement','sûrement'],'discrètement','Ostensiblement = de façon visible, affichée.'],['“Rogue” est proche de :',['hautain','servile','joyeux','précis'],'hautain','Rogue signifie rude et hautain.'],['Intrus :',['transparent','translucide','diaphane','opaque'],'opaque','Opaque s’oppose au champ de la transparence.'],['Meilleur synonyme de “fallacieux” ?',['trompeur','utile','durable','neutre'],'trompeur','Fallacieux signifie mensonger ou trompeur.'],['Antonyme de “prolixe” ?',['verbeux','laconique','emphatique','ampoulé'],'laconique','Prolixe = trop long ; laconique = très bref.'],['“Magnanime” signifie :',['généreux dans le pardon','très riche','trop bavard','malade'],'généreux dans le pardon','Magnanime qualifie une grandeur morale, notamment dans le pardon.'],['Paronyme : “notable” signifie plutôt...',['connu publiquement','remarquable','mensonger','proche'],'remarquable','Notable = remarquable ; notoire = connu publiquement.'],['Meilleur synonyme de “indolent” ?',['actif','nonchalant','violent','loyal'],'nonchalant','Indolent signifie mou, sans énergie.'],['Antonyme de “implicite” ?',['explicite','faux','laconique','secret'],'explicite','Implicite = sous-entendu ; explicite = clairement formulé.'],['“Ampoulé” qualifie un style...',['simple','lourdement soutenu','très bref','transparent'],'lourdement soutenu','Un style ampoulé est emphatique, artificiellement élevé.'],['Meilleur synonyme de “révulser” ?',['charmer','répugner','convaincre','rassurer'],'répugner','Révulser signifie inspirer un dégoût violent.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><div class="qtop"><span class="num">Question ${i+1}</span></div><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
