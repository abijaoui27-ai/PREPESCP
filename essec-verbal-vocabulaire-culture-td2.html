<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 2 — Vocabulaire, expressions & culture</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.03rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 3</span><h1>TD 2 — Niveau avancé</h1><p class="muted">QCM difficile : nuances lexicales, pièges de reformulation, racines complexes et logique implicite.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[['« Retourner sa veste » signifie :',['Changer d’avis par opportunisme','Abandonner un projet','Refuser un débat','Protéger quelqu’un'],'Changer d’avis par opportunisme','Expression liée à l’intérêt personnel et non à une évolution sincère.'],['« Être en porte-à-faux » signifie surtout :',['Être dans une position fragile ou incohérente','Être très influent','Prendre une décision rapide','Être neutre'],'Être dans une position fragile ou incohérente','La personne est exposée, déséquilibrée ou contradictoire.'],['« Tirer à boulets rouges sur quelqu’un » signifie :',['Le critiquer violemment','Le manipuler discrètement','L’ignorer volontairement','L’aider indirectement'],'Le critiquer violemment','Image d’une attaque frontale et intense.'],['« Faire profil bas » implique :',['Se faire discret','S’opposer ouvertement','Changer de camp','Prendre la tête d’un groupe'],'Se faire discret','On cherche à éviter l’attention ou le conflit.'],['Le proverbe « Chacun voit midi à sa porte » renvoie à :',['La subjectivité intéressée','La solidarité','La prudence','La transmission'],'La subjectivité intéressée','Chacun juge à partir de son propre intérêt.'],['« L’occasion fait le larron » signifie surtout :',['Le contexte favorise parfois la faute','Les voleurs sont organisés','Le hasard gouverne tout','Le travail est inutile'],'Le contexte favorise parfois la faute','La tentation apparaît quand l’opportunité existe.'],['« À force de forger, on devient forgeron » valorise :',['L’apprentissage par la pratique','Le talent inné','La compétition','L’obéissance'],'L’apprentissage par la pratique','La répétition construit progressivement la compétence.'],['« Trop de cuisiniers gâtent la sauce » critique :',['L’excès d’intervenants','Le manque de méthode','La précipitation','Le perfectionnisme'],'L’excès d’intervenants','Trop de participants peuvent rendre l’action inefficace.'],['La racine « olig » renvoie à :',['Un petit nombre','La chaleur','Le mouvement','Le peuple'],'Un petit nombre','Ex : oligarchie, oligopole.'],['Le mot « xénophobe » désigne quelqu’un qui :',['Rejette l’étranger','Étudie les peuples','Aime les voyages','Défend les traditions'],'Rejette l’étranger','xéno = étranger ; phobe = rejet/peur.'],['« Hypoglycémie » renvoie littéralement à :',['Un manque de sucre','Un excès de sucre','Une peur du sucre','Une maladie du foie'],'Un manque de sucre','hypo = insuffisance ; glyc = sucre.'],['« Démographie » combine :',['Peuple + écriture/description','Peuple + pouvoir','Humain + étude','Temps + mesure'],'Peuple + écriture/description','demo = peuple ; graph = décrire/écrire.'],['Le suffixe « -logie » indique généralement :',['Une étude structurée','Une peur','Une opposition','Une action'],'Une étude structurée','Ex : sociologie, biologie, géologie.'],['« Intermédiaire » contient le préfixe :',['inter','post','anti','pré'],'inter','inter = entre.'],['« Autonomie » renvoie surtout à :',['La capacité à agir seul','Le pouvoir politique','La rapidité','La mémoire'],'La capacité à agir seul','auto = soi-même ; nomos = règle.'],['« Chronophage » désigne quelque chose qui :',['Prend beaucoup de temps','Accélère un processus','Mesure le temps','Organise efficacement'],'Prend beaucoup de temps','chrono = temps ; phage = qui mange.'],['Que signifie « souffler le chaud et le froid » ?',['Alterner des attitudes contradictoires','Mentir constamment','Changer de sujet','Parler très vite'],'Alterner des attitudes contradictoires','On déstabilise en alternant encouragement et hostilité.'],['« Prendre quelqu’un à contre-pied » signifie :',['Le surprendre stratégiquement','Le contredire systématiquement','L’aider discrètement','Le pousser à agir'],'Le surprendre stratégiquement','Expression d’anticipation et de surprise.'],['« Faire machine arrière » signifie :',['Revenir sur une décision','Avancer plus vite','Changer de sujet','Perdre ses moyens'],'Revenir sur une décision','Image d’un recul ou renoncement stratégique.'],['« Se heurter à » signifie :',['Rencontrer une opposition','Obtenir un avantage','Ignorer une difficulté','Faire une erreur'],'Rencontrer une opposition','Obstacle ou résistance.'],['« Géopolitique » associe :',['Terre + organisation politique','Vie + pouvoir','Temps + société','Peuple + peur'],'Terre + organisation politique','géo = terre ; politique = organisation du pouvoir.'],['« Misanthrope » désigne quelqu’un qui :',['Déteste les humains','Étudie les sociétés','Aime la solitude','A peur des animaux'],'Déteste les humains','miso = haine ; anthropo = humain.'],['« Polymorphe » signifie :',['Qui prend plusieurs formes','Qui mesure le temps','Qui refuse le changement','Qui agit seul'],'Qui prend plusieurs formes','poly = plusieurs ; morph = forme.'],['« Macrocosme » renvoie à :',['Un ensemble vaste/global','Un petit univers','Une théorie sociale','Un modèle réduit'],'Un ensemble vaste/global','macro = grand.'],['« Mettre cartes sur table » signifie :',['Être transparent','Manipuler subtilement','Changer d’avis','Prendre des risques inutiles'],'Être transparent','On révèle clairement ses intentions ou informations.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong><br>${q[3]}</div></details></div>`).join('');</script></body></html>
