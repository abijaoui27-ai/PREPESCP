<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PrepOral - TD Geometrie 2</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1080px;margin:auto;padding:90px 24px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2rem}.muted{color:#9994aa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700}.case{line-height:1.7;margin:10px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.opt{border:1px solid rgba(201,169,110,.1);padding:6px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:8px;color:#c9f7dc}summary{color:#c9a96e;cursor:pointer}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:12px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.hero,.panel{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><h1>TD 2 — Niveau 2</h1><p class="muted">Géométrie : aires, volumes, unités, Pythagore, Thalès et échelles.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['Aire d’un triangle de base 12 et hauteur 5 ?',['30','60','17','25'],'30','Aire = base × hauteur / 2 = 12×5/2 = 30.'],['Volume d’un pavé 4 × 5 × 6 ?',['60','90','120','150'],'120','Volume = L×l×h = 120.'],['Un cube a côté 3. Volume ?',['9','18','27','81'],'27','3³ = 27.'],['1 m² vaut combien de cm² ?',['100','1000','10000','100000'],'10000','Les aires se convertissent de 100 en 100.'],['1 L vaut combien de dm³ ?',['0,1','1','10','100'],'1','Relation classique : 1 L = 1 dm³.'],['Un rectangle 8 par 6 a une diagonale de longueur ?',['10','12','14','16'],'10','Pythagore : 8²+6²=64+36=100, diagonale=10.'],['Un triangle 3-4-5 est-il rectangle ?',['Oui','Non','Impossible','Données insuffisantes'],'Oui','3²+4²=9+16=25=5².'],['Aire d’un disque de rayon 5 ?',['10π','20π','25π','50π'],'25π','Aire = πR² = 25π.'],['Volume d’un cylindre rayon 3 hauteur 10 ?',['30π','60π','90π','120π'],'90π','Volume = πR²h = π×9×10.'],['Si toutes les longueurs doublent, l’aire est multipliée par ?',['2','4','6','8'],'4','Les aires varient avec le carré du facteur.'],['Si toutes les longueurs doublent, le volume est multiplié par ?',['2','4','6','8'],'8','Les volumes varient avec le cube du facteur.'],['Un plan est à l’échelle 1/100. Une longueur de 3 cm sur le plan vaut ?',['30 cm','3 m','30 m','300 m'],'3 m','3 cm ×100 = 300 cm = 3 m.']];function render(){app.innerHTML=DATA.map((x,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="case">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></div>`).join('')}render();</script></body></html>
