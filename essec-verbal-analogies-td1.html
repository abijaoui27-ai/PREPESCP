<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Analogies verbales</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.05rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){n NERRE',['feu : fumée','nuit : étoile','pluie : parapluie','vent : voile'],'feu : fumée','Cause → conséquence/manifestation.'],['ÉCRIN : BIJOU',['carafe : eau','plume : oiseau','vase : fleuriste','cadeau : ruban'],'carafe : eau','Contenant → contenu.'],['PROLIXE : LACONIQUE',['opaque : limpide','rapide : vélo','calme : silence','riche : argent'],'opaque : limpide','Relation d’antonymie.'],['AVERSION : RÉPUGNANCE',['sérénité : calme','colère : sourire','peur : courage','critique : éloge'],'sérénité : calme','Synonymie proche.'],['MONASTÈRE : MOINE',['tribunal : juge','livre : auteur','carte : voyage','école : cahier'],'tribunal : juge','Lieu → occupant/fonction associée.'],['PLOMBIER : TUYAU',['chirurgien : bistouri','professeur : tableau','maçon : truelle','garagiste : moteur'],'garagiste : moteur','Métier → objet principal sur lequel il intervient.'],['RACINE : ARBRE',['fondation : maison','fenêtre : rideau','toit : tuile','rue : ville'],'fondation : maison','Élément de soutien/base → ensemble.'],['ANOREXIE : APPÉTIT',['insomnie : sommeil','fièvre : médecin','fatigue : sport','soif : eau'],'insomnie : sommeil','Trouble → fonction perturbée.'],['SABLIER : TEMPS',['thermomètre : température','boussole : nord','horloge : minute','carte : route'],'thermomètre : température','Instrument → grandeur mesurée.'],['GLOSSAIRE : MOTS',['atlas : cartes','roman : personnages','menu : restaurant','annuaire : téléphone'],'atlas : cartes','Recueil organisé → éléments qu’il rassemble.'],['AVOCAT : DÉFENDRE',['juge : juger','médecin : hôpital','client : payer','témoin : entendre'],'juge : juger','Personne/fonction → action caractéristique.'],['DÉSERT : ARIDITÉ',['banquise : froid','forêt : arbre','océan : vague','ville : bruit'],'banquise : froid','Lieu/milieu → caractéristique dominante.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}.
