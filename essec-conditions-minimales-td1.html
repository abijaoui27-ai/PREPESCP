<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PrepOral - TD Conditions 1</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1080px;margin:auto;padding:90px 24px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2rem}.muted{color:#9994aa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700}.case{color:#f0ede8;line-height:1.7;margin:10px 0}.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}.opt{border:1px solid rgba(201,169,110,.1);padding:6px;color:#9994aa;text-align:center}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:8px;color:#c9f7dc}summary{color:#c9a96e;cursor:pointer}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:12px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.hero,.panel{padding:20px}.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><h1>TD 1 — Niveau 1</h1><p class="muted">Conditions minimales : questions directes, logique de base I seule / II seule / ensemble.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['Quel est le prix initial d’un objet vendu 120 euros après réduction ?<br>I : la réduction est de 20%.<br>II : la réduction est de 30 euros.','D','I seule suffit : 120 représente 80%. II seule suffit : prix initial = 120 + 30.'],['Quel est l’âge de Paul ?<br>I : dans 8 ans, il aura le double de son âge actuel.<br>II : il a 12 ans de moins que sa sœur.','A','I donne une équation unique. II ne donne rien sans l’âge de la sœur.'],['Quelle est l’aire d’un rectangle ?<br>I : sa longueur vaut 12.<br>II : sa largeur vaut 5.','C','Chaque information seule est insuffisante. Ensemble, elles donnent l’aire.'],['A-t-on x supérieur à 10 ?<br>I : x vaut 12.<br>II : x est positif.','A','I donne oui avec certitude. II laisse plusieurs cas.'],['Quelle est la vitesse moyenne ?<br>I : la distance est de 120 km.<br>II : le temps est de 2 h.','C','Il faut distance et temps. Ensemble seulement.'],['Quel est le nombre total d’élèves ?<br>I : il y a 12 filles.<br>II : les filles représentent 40% de la classe.','C','Avec I et II, le total est déterminé. Séparément non.'],['Quel est le côté d’un carré ?<br>I : son aire vaut 49.<br>II : son périmètre vaut 28.','D','I seule donne le côté. II seule aussi.'],['Quel est le bénéfice ?<br>I : prix de vente 150 euros.<br>II : prix d’achat 90 euros.','C','Il faut les deux pour faire vente moins achat.'],['A-t-on un nombre pair ?<br>I : le nombre est divisible par 4.<br>II : le nombre est supérieur à 20.','A','Divisible par 4 implique pair. II ne suffit pas.'],['Quelle est la moyenne de deux notes ?<br>I : la somme des deux notes vaut 28.<br>II : la première note vaut 12.','A','Pour une moyenne de deux notes, la somme suffit. II seule ne suffit pas.'],['Quel est le périmètre d’un rectangle ?<br>I : longueur 8.<br>II : aire 40.','C','I seule ne donne pas la largeur. II seule non plus. Ensemble largeur 5.'],['Combien y a-t-il de cadres ?<br>I : il y a 200 salariés.<br>II : 30% sont cadres.','C','Il faut total et pourcentage. Ensemble seulement.']];function render(){app.innerHTML=DATA.map((x,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="case">${x[0]}</div><div class="opts"><div class="opt">A</div><div class="opt">B</div><div class="opt">C</div><div class="opt">D</div><div class="opt">E</div></div><details><summary>Correction</summary><div class="corr"><strong>Réponse : ${x[1]}</strong><br>${x[2]}</div></details></div>`).join('')}render();</script></body></html>
