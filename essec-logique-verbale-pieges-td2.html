<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD2 Culture verbale</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 2</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 5 — Culture verbale</div><h1>TD 2 — Pièges très difficiles</h1><p class="muted">30 QCM concours : sigles précis, genres rares, expressions figées, paronymes fins et erreurs très plausibles.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Très difficile</span><span class="tag">Concours</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['Que signifie ARCOM ?',['Autorité de régulation de la communication audiovisuelle et numérique','Agence régionale du commerce audiovisuel','Autorité républicaine de communication officielle','Association de régulation commerciale'],'Autorité de régulation de la communication audiovisuelle et numérique','Sigle récent issu notamment du rapprochement CSA/Hadopi.'],['Quel genre est correct ?',['un épitaphe','une épitaphe','le épitaphe','un épitaphe funéraire'],'une épitaphe','Épitaphe est féminin.'],['Quelle phrase est la plus correcte ?',['Il a pallié à cette difficulté','Il a pallié cette difficulté','Il a pallié de cette difficulté','Il a pallié sur cette difficulté'],'Il a pallié cette difficulté','Pallier se construit directement.'],['Effraction / infraction : que signifie effraction ?',['violation d’une règle','entrée forcée','jugement','hypothèse'],'entrée forcée','Infraction = violation ; effraction = entrée forcée.'],['Que signifie HCR ?',['Haut Commissariat des Nations unies pour les réfugiés','Haute Cour républicaine','Haut Conseil des réformes','Hôpital central régional'],'Haut Commissariat des Nations unies pour les réfugiés','Sigle international humanitaire.'],['Quel mot est masculin ?',['une interstice','un interstice','une auspice','une armistice'],'un interstice','Interstice est masculin.'],['Quelle expression est correcte ?',['à l’attention du directeur','à l’intention du courrier','à l’attention de ce projet','à l’intention de l’adresse postale'],'à l’attention du directeur','Pour un courrier : à l’attention de.'],['Sceptique / septique : que signifie sceptique ?',['infecté','qui doute','très propre','juridique'],'qui doute','Septique concerne l’infection ; sceptique le doute.'],['Que signifie ANSM ?',['Agence nationale de sécurité du médicament','Autorité nationale des statistiques médicales','Association nationale de santé mutualiste','Agence numérique de santé mondiale'],'Agence nationale de sécurité du médicament','Institution sanitaire française.'],['Quel genre est correct ?',['un apogée','une apogée','un orbite','un idole'],'une apogée','Apogée est féminin.'],['Quelle phrase est correcte ?',['Je me souviens cette règle','Je me souviens de cette règle','Je me rappelle de cette règle','Je me remémore de cette règle'],'Je me souviens de cette règle','Se souvenir de ; se rappeler quelque chose.'],['Inclinaison / inclination : inclination signifie plutôt :',['pente matérielle uniquement','penchant ou disposition','discours officiel','dommage subi'],'penchant ou disposition','Inclinaison peut être physique ; inclination est souvent morale ou affective.'],['Que signifie RSE ?',['Responsabilité sociétale des entreprises','Réforme sociale européenne','Régime salarial économique','Réseau supérieur des entreprises'],'Responsabilité sociétale des entreprises','À ne pas réduire à l’écologie seule.'],['Quel mot est féminin ?',['un ecchymose','une ecchymose','un météorite','un offre'],'une ecchymose','Ecchymose est féminin.'],['Quelle formulation est la plus sûre ?',['voire même','voire','voir même','voir davantage même'],'voire','Voire signifie déjà et même ; voire même est souvent jugé redondant.'],['Prodige / prodigue : prodigue signifie :',['extraordinaire','qui dépense beaucoup ou donne largement','très prudent','mensonger'],'qui dépense beaucoup ou donne largement','Prodigieux = extraordinaire ; prodigue = dépensier/généreux.'],['Que signifie ETI ?',['Entreprise de taille intermédiaire','Établissement technique industriel','Économie territoriale intégrée','Entreprise de transition internationale'],'Entreprise de taille intermédiaire','Catégorie d’entreprise entre PME et grande entreprise.'],['Quel genre est correct ?',['un enzyme','une enzyme','un omoplate','un acné'],'une enzyme','Enzyme est généralement féminin en usage courant.'],['Quelle phrase respecte la règle classique ?',['Après qu’il soit parti, tout a changé','Après qu’il est parti, tout a changé','Après qu’il parte, tout changea','Après qu’il serait parti, tout changea'],'Après qu’il est parti, tout a changé','Après que appelle l’indicatif.'],['Vénéneux / venimeux : venimeux qualifie plutôt :',['une plante toxique','un animal qui injecte du venin','un discours officiel','un document juridique'],'un animal qui injecte du venin','Vénéneux = toxique par ingestion ; venimeux = venin injecté.'],['Que signifie BFR ?',['Besoin en fonds de roulement','Bénéfice fiscal récurrent','Base financière régionale','Budget fixe de rendement'],'Besoin en fonds de roulement','Notion de finance d’entreprise.'],['Quel mot est masculin ?',['une équinoxe','un équinoxe','une emblème','une augure'],'un équinoxe','Équinoxe est masculin.'],['Quelle forme est correcte ?',['malgré qu’il pleuve','bien qu’il pleuve','malgré il pleut','malgré de pleuvoir'],'bien qu’il pleuve','Bien que + subjonctif est la forme sûre.'],['Amoral / immoral : amoral signifie :',['contraire à la morale','hors du champ moral','très moral','juridique'],'hors du champ moral','Immoral viole la morale ; amoral n’y renvoie pas.'],['Que signifie QVT ?',['Qualité de vie au travail','Quantité de valeur taxable','Question de vote territorial','Quota de valeur travail'],'Qualité de vie au travail','Sigle RH courant.'],['Quel genre est correct ?',['une augure','un augure','la augure','une bon augure'],'un augure','On dit un bon augure.'],['Quelle expression est correcte ?',['des événements conséquents','des événements importants','des événements conséquentiels','des événements de conséquence énorme'],'des événements importants','Conséquent signifie logiquement cohérent ; l’usage pour important est critiqué en langue soignée.'],['Notoire / notable : notoire signifie :',['important','connu publiquement','secret','hypothétique'],'connu publiquement','Notable = important/remarquable ; notoire = connu de tous.'],['Que signifie EBE ?',['Excédent brut d’exploitation','Équilibre budgétaire européen','Épargne brute des entreprises','Évaluation bancaire externe'],'Excédent brut d’exploitation','Indicateur de performance économique.'],['Quel mot est féminin ?',['un anagramme','une anagramme','un apostrophe','un alcôve'],'une anagramme','Anagramme est féminin.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
