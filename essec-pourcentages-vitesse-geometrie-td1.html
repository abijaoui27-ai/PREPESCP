<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PrepOral - TD Pourcentages 1</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1080px;margin:auto;padding:90px 24px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2rem}.muted{color:#9994aa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700}.case{line-height:1.7;margin:10px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.opt{border:1px solid rgba(201,169,110,.1);padding:6px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:8px;color:#c9f7dc}summary{color:#c9a96e;cursor:pointer}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:12px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.hero,.panel{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><h1>TD 1 — Niveau 1</h1><p class="muted">Pourcentages, vitesse simple, conversions et rendement basique.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['Un prix de 200 euros augmente de 15%. Nouveau prix ?',['215','220','225','230'],'230','15% de 200 = 30, donc 230.'],['Un article vaut 120 euros après une baisse de 20%. Prix initial ?',['140','145','150','160'],'150','120 représente 80%, donc 120 / 0,8 = 150.'],['Une voiture fait 180 km en 3 h. Vitesse moyenne ?',['50','55','60','65'],'60','V = D/T = 180/3 = 60 km/h.'],['10 m/s en km/h ?',['18','24','30','36'],'36','On multiplie par 3,6 : 10 × 3,6 = 36.'],['Deux personnes travaillent à des rythmes 1/4 et 1/6 du travail par heure. Rythme ensemble ?',['5/12','1/10','1/24','2/5'],'5/12','1/4 + 1/6 = 3/12 + 2/12 = 5/12.'],['Une quantité passe de 80 à 100. Evolution ?',['20%','25%','30%','40%'],'25%','Gain 20 sur base 80 : 20/80 = 25%.'],['Après +10% puis +10%, évolution globale ?',['20%','21%','22%','19%'],'21%','1,1 × 1,1 = 1,21.'],['Un coureur fait 12 km en 1h30. Vitesse ?',['6','8','10','12'],'8','1h30 = 1,5h ; 12/1,5 = 8.'],['Un travail est fait seul en 5h. Quelle fraction en 1h ?',['1/2','1/3','1/5','1/10'],'1/5','En une heure, il fait 1/5 du travail.'],['Une solution de 300 L contient 60% d’alcool. Volume d’alcool ?',['120','150','180','200'],'180','60% de 300 = 180.'],['Un prix passe de 50 à 40. Baisse ?',['10%','15%','20%','25%'],'20%','Perte 10 sur base 50 = 20%.'],['Un train roule 2h à 100 km/h puis 1h à 80 km/h. Distance totale ?',['260','270','280','300'],'280','2×100 + 1×80 = 280 km.']];function render(){app.innerHTML=DATA.map((x,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="case">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></div>`).join('')}render();</script></body></html>
