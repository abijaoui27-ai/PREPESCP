<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Séries graphiques & matrices</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.14);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.32);--green:#58d68d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(0,85,179,.12),transparent 28%),var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:12.2px;line-height:1.42}nav{position:fixed;top:0;left:0;right:0;background:rgba(7,7,12,.97);padding:17px 48px;border-bottom:1px solid rgba(201,169,110,.08);display:flex;justify-content:space-between;align-items:center;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:var(--gold);text-decoration:none;font-size:1.35rem}.mid{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:6px 14px}.back{color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:7px 15px}.main{max-width:1180px;margin:auto;padding:92px 24px 55px}.hero,.panel{background:var(--surface);border:1px solid var(--border);padding:25px 32px;margin-bottom:16px}.hero{border-top:2px solid #0055b3}h1{font-family:'Cormorant Garamond',serif;font-size:2.25rem;margin:8px 0}.muted{color:var(--muted)}.tag{display:inline-block;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 9px;margin:4px 4px 0 0;font-size:.62rem;text-transform:uppercase;letter-spacing:1.4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:14px}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.num{color:var(--gold);font-weight:700}.type{font-size:.58rem;letter-spacing:1.2px;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:4px 7px;text-transform:uppercase}.visual{background:#101521;border:1px solid rgba(0,85,179,.25);padding:10px;margin:9px 0}.visual svg{width:100%;height:auto;display:block;max-width:480px;margin:auto}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);background:rgba(255,255,255,.015);padding:8px;color:#aaa4ba}.mini svg{width:100%;height:auto;display:block}.question{font-weight:600;margin:8px 0;color:#f0ede8}summary{cursor:pointer;color:var(--gold);margin-top:10px;font-weight:600}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:8px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:#fff;text-decoration:none;padding:10px 18px;margin-top:16px}.shape{fill:#132033;stroke:#c9a96e;stroke-width:2}.gold{fill:#c9a96e}.white{fill:#f0ede8}.blue{fill:#0072e5}.line{stroke:#c9a96e;stroke-width:2;fill:none}.qmark{fill:#f0ede8;font-size:25px;font-family:Outfit,sans-serif;font-weight:700}.arr{fill:#c9a96e;font-size:17px;font-family:Outfit,sans-serif}@media(max-width:800px){nav{padding:15px 18px}.mid{display:none}.main{padding:78px 14px}.hero,.panel{padding:20px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><div class="mid">ESSEC — TD 1</div><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Chapitre 6</span><h1>TD 1 — Séries graphiques & matrices</h1><p class="muted">Niveau moyen/difficile : déplacements, alternances, effets masque, petites matrices et transformations simples combinées.</p><span class="tag">20 questions</span><span class="tag">visuel</span></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>
const svgs=[
`<svg viewBox="0 0 420 110"><rect x="20" y="25" width="50" height="50" class="shape"/><circle cx="32" cy="38" r="6" class="blue"/><text x="85" y="58" class="arr">→</text><rect x="120" y="25" width="50" height="50" class="shape"/><circle cx="145" cy="38" r="6" class="blue"/><text x="185" y="58" class="arr">→</text><rect x="220" y="25" width="50" height="50" class="shape"/><circle cx="258" cy="38" r="6" class="blue"/><text x="285" y="58" class="arr">→</text><rect x="320" y="25" width="50" height="50" class="shape"/><text x="338" y="61" class="qmark">?</text></svg>`,
`<svg viewBox="0 0 420 110"><rect x="20" y="25" width="50" height="50" class="shape"/><rect x="27" y="32" width="12" height="12" class="gold"/><text x="85" y="58" class="arr">→</text><rect x="120" y="25" width="50" height="50" class="shape"/><rect x="151" y="32" width="12" height="12" class="gold"/><text x="185" y="58" class="arr">→</text><rect x="220" y="25" width="50" height="50" class="shape"/><rect x="251" y="56" width="12" height="12" class="gold"/><text x="285" y="58" class="arr">→</text><rect x="320" y="25" width="50" height="50" class="shape"/><text x="338" y="61" class="qmark">?</text></svg>`,
`<svg viewBox="0 0 420 110"><polygon points="45,25 70,75 20,75" fill="none" stroke="#c9a96e" stroke-width="2"/><text x="90" y="58" class="arr">→</text><rect x="125" y="30" width="45" height="45" fill="none" stroke="#c9a96e" stroke-width="2"/><text x="190" y="58" class="arr">→</text><polygon points="245,25 270,45 260,75 230,75 220,45" fill="none" stroke="#c9a96e" stroke-width="2"/><text x="290" y="58" class="arr">→</text><rect x="325" y="25" width="50" height="50" class="shape"/><text x="343" y="61" class="qmark">?</text></svg>`,
`<svg viewBox="0 0 420 110"><rect x="20" y="25" width="55" height="55" class="shape"/><circle cx="47" cy="52" r="10" class="white"/><text x="90" y="58" class="arr">→</text><rect x="125" y="25" width="55" height="55" class="shape"/><circle cx="152" cy="52" r="10" class="gold"/><text x="195" y="58" class="arr">→</text><rect x="230" y="25" width="55" height="55" class="shape"/><circle cx="257" cy="52" r="10" class="white"/><text x="300" y="58" class="arr">→</text><rect x="335" y="25" width="55" height="55" class="shape"/><text x="354" y="62" class="qmark">?</text></svg>`,
`<svg viewBox="0 0 420 120"><g transform="translate(35,20)"><rect width="48" height="48" class="shape"/><circle cx="24" cy="24" r="10" class="white"/></g><g transform="translate(95,20)"><rect width="48" height="48" class="shape"/><rect x="14" y="14" width="20" height="20" class="gold"/></g><g transform="translate(155,20)"><rect width="48" height="48" class="shape"/><circle cx="18" cy="24" r="8" class="white"/><rect x="27" y="14" width="16" height="16" class="gold"/></g><g transform="translate(35,75)"><rect width="48" height="38" class="shape"/><line x1="10" y1="30" x2="38" y2="8" class="line"/></g><g transform="translate(95,75)"><rect width="48" height="38" class="shape"/><polygon points="24,7 38,31 10,31" fill="none" stroke="#f0ede8" stroke-width="2"/></g><g transform="translate(155,75)"><rect width="48" height="38" class="shape"/><text x="17" y="27" class="qmark">?</text></g></svg>`
];
const Q=[
{t:'déplacement',v:0,q:'Quel est le prochain emplacement du point bleu ?',o:['En bas à gauche','En haut à gauche','Au centre','En bas à droite'],r:'A. En bas à gauche',c:'Le point avance vers la droite. Arrivé au bord, il réapparaît de l’autre côté puis descend : effet passe-muraille.'},
{t:'déplacement',v:1,q:'Où doit se trouver le carré doré ?',o:['En bas à gauche','En haut à gauche','Au centre','En bas à droite'],r:'A. En bas à gauche',c:'Il tourne dans les coins : haut gauche → haut droit → bas droit → bas gauche.'},
{t:'forme',v:2,q:'Quelle figure doit suivre ?',o:['Hexagone','Triangle','Cercle','Carré'],r:'A. Hexagone',c:'Le nombre de côtés augmente : 3 → 4 → 5 → 6.'},
{t:'couleur',v:3,q:'Quelle couleur doit avoir le rond ?',o:['Blanc','Doré','Bleu','Absent'],r:'B. Doré',c:'Alternance blanc → doré → blanc → doré.'},
{t:'matrice',v:4,q:'Quelle règle complète la case manquante ?',o:['Addition des deux formes','Suppression des deux formes','Rotation seule','Changement de couleur'],r:'A. Addition des deux formes',c:'La troisième case de chaque ligne combine les deux premières.'},
{t:'piège',v:0,q:'Quel piège principal est testé ?',o:['Effet masque','Effet passe-muraille','Symétrie centrale','Superposition'],r:'B. Effet passe-muraille',c:'Le point sort d’un côté et réapparaît de l’autre.'},
{t:'matrice',v:4,q:'Dans la deuxième ligne, que doit-on voir dans la case manquante ?',o:['Triangle + diagonale','Seulement triangle','Seulement diagonale','Deux cercles'],r:'A. Triangle + diagonale',c:'Même logique que la première ligne : combinaison.'},
{t:'transformation',v:2,q:'Quel paramètre évolue principalement ?',o:['Le nombre de côtés','La couleur','La taille uniquement','La position'],r:'A. Le nombre de côtés',c:'Triangle, carré, pentagone : progression du nombre de côtés.'},
{t:'déplacement',v:1,q:'Quel type de déplacement reconnaît-on ?',o:['Linéaire','Circulaire par coins','Aléatoire','Ping-pong vertical'],r:'B. Circulaire par coins',c:'Le carré parcourt les quatre coins du cadre.'},
{t:'couleur',v:3,q:'La règle est surtout une règle de :',o:['rotation','alternance de couleur','superposition','progression alphabétique'],r:'B. alternance de couleur',c:'La position reste stable ; seule la couleur alterne.'},
{t:'raisonnement',v:0,q:'Quelle réponse éliminer en premier ?',o:['Une réponse avec le point hors cadre','Une réponse en bas à gauche','Une réponse qui conserve le cadre','Une réponse avec le point visible'],r:'A. Une réponse avec le point hors cadre',c:'Dans ces séries, les éléments restent dans le cadre : l’extérieur est impossible.'},
{t:'raisonnement',v:1,q:'Si la série continuait encore après la bonne réponse, le carré irait ensuite :',o:['En haut à gauche','En haut à droite','Au centre','Il disparaîtrait'],r:'A. En haut à gauche',c:'Cycle des coins : bas gauche → haut gauche.'},
{t:'matrice',v:4,q:'Dans une matrice de combinaison, la bonne réponse doit :',o:['reprendre tous les éléments nécessaires','être la plus simple possible même incomplète','changer toutes les couleurs','supprimer les formes communes'],r:'A. reprendre tous les éléments nécessaires',c:'La combinaison impose de retrouver les éléments des cases de départ.'},
{t:'piège',v:3,q:'Pourquoi “le rond disparaît” serait une mauvaise conclusion ?',o:['Car aucun indice ne justifie une suppression','Car il y a toujours deux ronds','Car la forme change','Car le cadre tourne'],r:'A. Car aucun indice ne justifie une suppression',c:'Il faut rester sur la règle visible : alternance de couleur.'},
{t:'visuel',v:2,q:'Si on applique la règle une étape de plus après l’hexagone, on attendrait :',o:['Un heptagone','Un triangle','Un carré','Une étoile'],r:'A. Un heptagone',c:'La progression continue avec un côté supplémentaire.'},
{t:'méthode',v:0,q:'Quelle est la meilleure première étape ?',o:['Identifier les éléments mobiles','Choisir la réponse la plus jolie','Regarder seulement la dernière figure','Compter les lettres'],r:'A. Identifier les éléments mobiles',c:'On découpe la figure avant de choisir.'},
{t:'déplacement',v:1,q:'Le carré doré ne suit pas :',o:['un mouvement par coins','un cycle','une translation pure horizontale','une règle stable'],r:'C. une translation pure horizontale',c:'Il change aussi de ligne : ce n’est pas seulement horizontal.'},
{t:'matrice',v:4,q:'La logique de la matrice fonctionne ici :',o:['par ligne','uniquement par diagonale','par ordre alphabétique','par taille décroissante'],r:'A. par ligne',c:'Chaque ligne se résout par combinaison des deux premières cases.'},
{t:'piège',v:0,q:'Le point bleu doit rester cohérent avec :',o:['sa trajectoire','la couleur du cadre','le nombre de côtés','la taille du texte'],r:'A. sa trajectoire',c:'Le critère déterminant est le mouvement du point.'},
{t:'synthèse',v:4,q:'La meilleure méthode générale est :',o:['décomposer la figure en éléments','deviner directement','regarder uniquement les couleurs','choisir l’option la plus chargée'],r:'A. décomposer la figure en éléments',c:'C’est la méthode de base des séries graphiques.'}
];
app.innerHTML=Q.map((x,i)=>`<div class="q"><div class="qtop"><div class="num">Question ${i+1}</div><div class="type">${x.t}</div></div><div class="visual">${svgs[x.v]}</div><div class="question">${x.q}</div><div class="opts">${x.o.map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x.r}</strong><br>${x.c}</div></details></div>`).join('');
</script></body></html>
