<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Séries graphiques & matrices</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.14);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.32);--green:#58d68d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(0,85,179,.12),transparent 28%),var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:11.8px;line-height:1.38}nav{position:fixed;top:0;left:0;right:0;background:rgba(7,7,12,.97);padding:17px 48px;border-bottom:1px solid rgba(201,169,110,.08);display:flex;justify-content:space-between;align-items:center;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:var(--gold);text-decoration:none;font-size:1.35rem}.mid{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:6px 14px}.back{color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:7px 15px}.main{max-width:1200px;margin:auto;padding:92px 20px 55px}.hero,.panel{background:var(--surface);border:1px solid var(--border);padding:24px 30px;margin-bottom:16px}.hero{border-top:2px solid #0055b3}h1{font-family:'Cormorant Garamond',serif;font-size:2.25rem;margin:8px 0}.muted{color:var(--muted)}.tag{display:inline-block;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 9px;margin:4px 4px 0 0;font-size:.6rem;text-transform:uppercase;letter-spacing:1.4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:13px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.num{color:var(--gold);font-weight:700}.type{font-size:.56rem;letter-spacing:1.2px;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:4px 7px;text-transform:uppercase}.visual{background:#101521;border:1px solid rgba(0,85,179,.25);padding:9px;margin:8px 0}.visual svg{width:100%;height:auto;display:block;max-width:520px;margin:auto}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);background:rgba(255,255,255,.015);padding:7px;color:#aaa4ba}.question{font-weight:600;margin:8px 0;color:#f0ede8}summary{cursor:pointer;color:var(--gold);margin-top:9px;font-weight:600}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.07);padding:8px;color:#c9f7dc;margin-top:8px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:#fff;text-decoration:none;padding:10px 18px;margin-top:16px}.shape{fill:#132033;stroke:#c9a96e;stroke-width:2}.g{fill:#c9a96e}.w{fill:#f0ede8}.b{fill:#0072e5}.line{stroke:#c9a96e;stroke-width:2;fill:none}.thin{stroke:#9994aa;stroke-width:1;fill:none}.qmark{fill:#f0ede8;font-size:24px;font-family:Outfit,sans-serif;font-weight:700}.arr{fill:#c9a96e;font-size:16px;font-family:Outfit,sans-serif}.lab{fill:#9994aa;font-size:10px;font-family:Outfit,sans-serif}@media(max-width:800px){nav{padding:15px 18px}.mid{display:none}.main{padding:78px 12px}.hero,.panel{padding:18px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><div class="mid">ESSEC — TD 1</div><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Chapitre 6</span><h1>TD 1 — Séries graphiques & matrices</h1><p class="muted">Niveau difficile réel : séries visuelles mélangées, matrices, déplacements combinés, rotations, effets masque et distracteurs proches.</p><span class="tag">24 questions</span><span class="tag">difficile</span><span class="tag">sans répétition</span></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>
function C(x,y,s=52,inner=''){return `<g transform="translate(${x},${y})"><rect width="${s}" height="${s}" class="shape"/>${inner}</g>`}function dot(x,y,c='w',r=6){return `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`}function sq(x,y,c='g',s=12){return `<rect x="${x}" y="${y}" width="${s}" height="${s}" class="${c}"/>`}function tri(x,y,c='w'){return `<polygon points="${x},${y-10} ${x+12},${y+12} ${x-12},${y+12}" fill="none" stroke="${c=='g'?'#c9a96e':'#f0ede8'}" stroke-width="2"/>`}function arrow(x,y,r=0,c='g'){return `<g transform="translate(${x},${y}) rotate(${r})"><path d="M-11,0 L9,0 M3,-6 L10,0 L3,6" stroke="${c=='g'?'#c9a96e':'#f0ede8'}" stroke-width="2" fill="none"/></g>`}function A(x){return `<text x="${x}" y="60" class="arr">→</text>`}
const V=[
`<svg viewBox="0 0 520 125">${C(20,32,50,dot(14,14,'w')+sq(34,34,'g'))}${A(85)}${C(120,32,50,dot(36,14,'w')+sq(8,34,'g'))}${A(185)}${C(220,32,50,dot(36,36,'w')+sq(8,8,'g'))}${A(285)}${C(320,32,50,dot(14,36,'w')+sq(34,8,'g'))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 125">${C(20,32,50,arrow(25,25,0)+dot(12,38,'b'))}${A(85)}${C(120,32,50,arrow(25,25,90)+dot(38,38,'b'))}${A(185)}${C(220,32,50,arrow(25,25,180)+dot(38,12,'b'))}${A(285)}${C(320,32,50,arrow(25,25,270)+dot(12,12,'b'))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 140"><g transform="translate(25,15)">${C(0,0,45,dot(22,22,'w'))}${C(55,0,45,sq(16,16,'g'))}${C(110,0,45,dot(15,22,'w')+sq(25,15,'g'))}${C(0,55,45,tri(22,22,'w'))}${C(55,55,45,arrow(22,22,45))}${C(110,55,45,'<text x="15" y="30" class="qmark">?</text>')}</g><text x="215" y="72" class="lab">Matrice : case 3 = combinaison des deux premières</text></svg>`,
`<svg viewBox="0 0 520 125">${C(20,32,50,sq(8,8,'g')+sq(30,30,'g'))}${A(85)}${C(120,32,50,sq(8,30,'g')+sq(30,8,'g'))}${A(185)}${C(220,32,50,sq(8,8,'g')+sq(30,30,'g')+dot(25,25,'w',5))}${A(285)}${C(320,32,50,sq(8,30,'g')+sq(30,8,'g')+dot(25,25,'w',5))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 125">${C(20,32,50,tri(25,25,'w')+dot(25,25,'b',4))}${A(85)}${C(120,32,50,tri(25,25,'g')+dot(25,25,'b',4))}${A(185)}${C(220,32,50,'<rect x="13" y="13" width="24" height="24" fill="none" stroke="#f0ede8" stroke-width="2"/>'+dot(25,25,'b',4))}${A(285)}${C(320,32,50,'<rect x="13" y="13" width="24" height="24" fill="none" stroke="#c9a96e" stroke-width="2"/>'+dot(25,25,'b',4))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 125">${C(20,32,50,dot(14,14,'w')+dot(36,36,'b'))}${A(85)}${C(120,32,50,dot(14,36,'w')+dot(36,14,'b'))}${A(185)}${C(220,32,50,dot(25,25,'b')+dot(25,25,'w',4))}${A(285)}${C(320,32,50,dot(36,14,'w')+dot(14,36,'b'))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 125">${C(20,32,50,'<path d="M10 38 H40" class="line"/>'+dot(25,38,'w'))}${A(85)}${C(120,32,50,'<path d="M10 25 H40" class="line"/>'+dot(25,25,'w'))}${A(185)}${C(220,32,50,'<path d="M10 12 H40" class="line"/>'+dot(25,12,'w'))}${A(285)}${C(320,32,50,'<path d="M10 25 H40" class="line"/>'+dot(25,25,'w'))}${A(385)}${C(420,32,50,'<text x="18" y="33" class="qmark">?</text>')}</svg>`,
`<svg viewBox="0 0 520 140"><g transform="translate(30,15)">${C(0,0,42,dot(14,14,'w')+sq(26,26,'g',8))}${C(50,0,42,dot(28,14,'w')+sq(8,26,'g',8))}${C(100,0,42,dot(28,28,'w')+sq(8,8,'g',8))}${C(0,50,42,arrow(21,21,0)+dot(10,32,'b',4))}${C(50,50,42,arrow(21,21,90)+dot(32,32,'b',4))}${C(100,50,42,'<text x="14" y="28" class="qmark">?</text>')}</g><text x="205" y="70" class="lab">Deux règles : mouvement + rotation</text></svg>`
];
const Q=[
{v:0,t:'double règle',q:'Quelle description correspond à la figure suivante ?',o:['Rond haut-gauche, carré bas-droit','Rond haut-gauche, carré bas-gauche','Rond bas-gauche, carré haut-droit','Rond bas-droit, carré haut-gauche'],r:'A. Rond haut-gauche, carré bas-droit',c:'Les deux éléments tournent chacun dans les coins, mais en sens inverse. Après la 4e figure, on revient à la configuration initiale.'},
{v:1,t:'rotation + déplacement',q:'Quelle est la prochaine configuration ?',o:['Flèche vers la droite, point en bas gauche','Flèche vers le haut, point en haut gauche','Flèche vers le bas, point au centre','Flèche vers la gauche, point en bas droit'],r:'A. Flèche vers la droite, point en bas gauche',c:'La flèche tourne de 90° à chaque étape ; le point bleu suit les coins en sens inverse.'},
{v:2,t:'matrice',q:'Que doit contenir la case manquante ?',o:['Triangle + flèche diagonale','Triangle seul','Flèche seule','Carré + rond'],r:'A. Triangle + flèche diagonale',c:'Chaque ligne combine les éléments des deux premières cases dans la troisième.'},
{v:3,t:'alternance',q:'Quelle figure suit ?',o:['Deux carrés en diagonale descendante + rond central','Deux carrés en diagonale montante sans rond','Un seul carré + rond central','Trois carrés sans rond'],r:'A. Deux carrés en diagonale descendante + rond central',c:'La diagonale alterne et le rond central apparaît deux figures sur deux.'},
{v:4,t:'forme + couleur',q:'Quelle transformation doit suivre ?',o:['Pentagone blanc avec point bleu','Carré blanc sans point','Pentagone doré avec point bleu','Triangle doré avec point blanc'],r:'A. Pentagone blanc avec point bleu',c:'La forme progresse par nombre de côtés ; la couleur alterne blanc/doré ; le point bleu reste invariant.'},
{v:5,t:'effet masque',q:'Pourquoi la 3e figure est-elle piégeuse ?',o:['Les deux points se superposent','Le cadre disparaît','La couleur alterne seulement','La règle devient alphabétique'],r:'A. Les deux points se superposent',c:'Le blanc et le bleu occupent la même zone : un élément peut masquer l’autre.'},
{v:6,t:'ping-pong',q:'Quel mouvement reconnaît-on ?',o:['Ping-pong vertical','Passe-muraille horizontal','Rotation 180°','Superposition'],r:'A. Ping-pong vertical',c:'La ligne monte puis redescend : elle rebondit aux extrémités.'},
{v:7,t:'matrice double',q:'Dans la case manquante, que doit-on obtenir ?',o:['Flèche vers le bas + point bleu en haut droit','Flèche vers la gauche + point bleu en bas gauche','Flèche vers le haut + point bleu au centre','Flèche vers la droite + point absent'],r:'A. Flèche vers le bas + point bleu en haut droit',c:'On applique à la seconde ligne la même progression que dans la première : rotation + déplacement par coin.'},
{v:0,t:'élimination',q:'Quelle option est impossible ?',o:['Rond et carré dans deux coins opposés','Rond et carré dans le même coin','Rond blanc visible','Carré doré visible'],r:'B. Rond et carré dans le même coin',c:'Dans cette série, les deux trajectoires restent opposées ; une superposition n’est pas prévue.'},
{v:1,t:'cycle',q:'Après deux figures supplémentaires après le point d’interrogation, la flèche pointerait vers :',o:['gauche','droite','haut','bas'],r:'A. gauche',c:'Après la réponse, la rotation continue par +90° : droite → bas → gauche.'},
{v:2,t:'raven',q:'Quelle règle doit être privilégiée pour éviter le piège ?',o:['Lire par ligne avant de lire par diagonale','Compter seulement les formes noires','Choisir la figure la plus chargée','Ignorer la première ligne'],r:'A. Lire par ligne avant de lire par diagonale',c:'La première ligne donne la clé : 1 + 2 = 3.'},
{v:3,t:'rythme',q:'Quelle est la double alternance ?',o:['Diagonale des carrés + présence du rond','Taille + alphabet','Rotation + suppression','Couleur seule'],r:'A. Diagonale des carrés + présence du rond',c:'Deux paramètres évoluent simultanément.'},
{v:4,t:'progression',q:'Quelle erreur ferait un candidat trop rapide ?',o:['Ne voir que l’alternance de couleur','Repérer le nombre de côtés','Observer le point invariant','Comparer toutes les figures'],r:'A. Ne voir que l’alternance de couleur',c:'La couleur ne suffit pas : la forme évolue aussi.'},
{v:5,t:'masque',q:'Si deux éléments occupent exactement la même position, on doit d’abord supposer :',o:['un effet masque','une suppression définitive','une erreur de série','une nouvelle règle alphabétique'],r:'A. un effet masque',c:'C’est un piège classique : un élément peut être caché par l’autre.'},
{v:6,t:'trajectoire',q:'Quelle serait la figure suivante après le point d’interrogation ?',o:['Ligne en bas avec point en bas','Ligne au centre avec point au centre','Ligne en haut avec point en haut','Ligne diagonale'],r:'B. Ligne au centre avec point au centre',c:'Après bas → centre → haut → centre, la suite revient au bas puis centre.'},
{v:7,t:'synthèse visuelle',q:'Quel paramètre est invariant ?',o:['La taille du cadre','La direction de la flèche','La position du point','La couleur du point'],r:'A. La taille du cadre',c:'Le cadre sert de repère fixe ; les éléments internes changent.'},
{v:0,t:'piège ESSEC',q:'La règle la plus économique est :',o:['deux déplacements circulaires inverses','une rotation du cadre','une suppression alternée','un changement de taille'],r:'A. deux déplacements circulaires inverses',c:'Elle explique toutes les figures avec le moins d’hypothèses.'},
{v:1,t:'lecture fine',q:'Quel détail empêche de répondre seulement avec la rotation ?',o:['Le point bleu se déplace aussi','La flèche disparaît','Le cadre change de taille','Le nombre de côtés varie'],r:'A. Le point bleu se déplace aussi',c:'La bonne réponse doit vérifier tous les éléments.'},
{v:2,t:'matrice',q:'Dans une matrice de ce type, une option est fausse si elle :',o:['oublie un des deux éléments combinés','contient les deux éléments','respecte la ligne','reprend la diagonale'],r:'A. oublie un des deux éléments combinés',c:'La case résultat doit combiner intégralement.'},
{v:3,t:'suite',q:'La prochaine figure doit avoir :',o:['le rond central et la diagonale descendante','pas de rond et la diagonale montante','un rond central et une seule case','trois ronds alignés'],r:'A. le rond central et la diagonale descendante',c:'On revient au rythme de la figure 3 : diagonale descendante + rond.'},
{v:4,t:'transformation',q:'Quel paramètre n’évolue pas ?',o:['Le point central','La couleur du contour','La forme extérieure','Le nombre de côtés'],r:'A. Le point central',c:'Le point bleu reste stable ; le reste varie.'},
{v:5,t:'raisonnement',q:'La figure suivante après la 4e doit probablement :',o:['séparer à nouveau les deux points','supprimer les deux points','changer le cadre','ajouter une flèche'],r:'A. séparer à nouveau les deux points',c:'Après superposition, les trajectoires continuent : les éléments se séparent.'},
{v:6,t:'méthode',q:'Quel mot-clé décrit le mieux la série ?',o:['rebond','fusion','superposition permanente','addition'],r:'A. rebond',c:'Le mouvement va et vient entre les positions extrêmes.'},
{v:7,t:'niveau concours',q:'Quelle stratégie donne la réponse la plus sûre ?',o:['suivre chaque élément séparément','choisir l’option la plus symétrique','se fier à la première impression','regarder seulement la dernière case'],r:'A. suivre chaque élément séparément',c:'C’est indispensable dès qu’il y a deux règles simultanées.'}
];
app.innerHTML=Q.map((x,i)=>`<div class="q"><div class="qtop"><div class="num">Question ${i+1}</div><div class="type">${x.t}</div></div><div class="visual">${V[x.v]}</div><div class="question">${x.q}</div><div class="opts">${x.o.map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x.r}</strong><br>${x.c}</div></details></div>`).join('');
</script></body></html>
