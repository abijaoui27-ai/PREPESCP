<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="format-detection" content="telephone=no"><title>PrepOral - TD1 Mastermind</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0055b3;--blue2:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px;position:relative}.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#003b7a,#0072e5)}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue2);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.panel{padding:22px 28px;margin-bottom:13px}.panel h2{font-family:'Cormorant Garamond',serif;font-size:1.38rem;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.num{color:var(--gold);font-weight:700}.skill{font-size:.56rem;color:var(--blue2);border:1px solid var(--blueborder);padding:3px 6px;text-transform:uppercase;letter-spacing:1px}.case{font-size:.8rem;color:var(--text);line-height:1.7;background:rgba(255,255,255,.025);border:1px solid rgba(201,169,110,.08);padding:9px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC - TD 1</div><a href="/essec-psycho.html" class="back">Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 3 - Mastermind BP / MP</div><h1>TD 1 - Codes niveau 1</h1><p class="muted">Codes a 3 chiffres. Objectif : utiliser les lignes a zero, les BP certains et les MP simples.</p><div class="toolbar"><span class="tag">20 questions</span><span class="tag">Niveau 1</span><span class="tag">Codes 3 chiffres</span></div></section><section class="panel"><h2>Questions</h2><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour a l'espace psychotechnique</a></section></main><script>const DATA=[['A: 1 2 3 → 0 BP / 0 MP<br>B: 4 5 6 → 1 BP / 0 MP<br>C: 4 7 8 → 0 BP / 1 MP<br>D: 9 5 8 → 2 BP / 0 MP',['958','956','758','954'],'958','1,2,3 absents. Dans B, un seul BP. La ligne C interdit 4 en position 1. La ligne D donne 9 et 5 bien places, et 8 absent ou non place selon croisement : le code compatible est 958.','elimination'],['A: 2 4 6 → 0 BP / 0 MP<br>B: 1 3 5 → 1 BP / 1 MP<br>C: 1 7 8 → 1 BP / 0 MP<br>D: 9 3 1 → 0 BP / 2 MP',['173','178','318','531'],'178','2,4,6 absents. Dans C, un seul chiffre est bien place. Les croisements avec B et D donnent 1 en position 1, puis 7 et 8.','croisement'],['A: 5 6 7 → 0 BP / 0 MP<br>B: 1 2 3 → 1 BP / 1 MP<br>C: 1 4 8 → 0 BP / 1 MP<br>D: 9 2 3 → 2 BP / 0 MP',['923','928','123','924'],'923','5,6,7 absents. D donne deux BP parmi 9,2,3. Avec B et C, 2 et 3 restent bien places, et 9 complete.','BP'],['A: 1 8 9 → 0 BP / 0 MP<br>B: 2 3 4 → 1 BP / 1 MP<br>C: 2 5 6 → 0 BP / 1 MP<br>D: 7 3 4 → 2 BP / 0 MP',['734','736','234','754'],'734','1,8,9 absents. D donne 2 BP. La ligne C montre que 2 est present mais mal place, donc 3 et 4 sont les deux BP de D.','MP'],['A: 3 4 5 → 0 BP / 0 MP<br>B: 1 2 6 → 1 BP / 1 MP<br>C: 7 2 8 → 1 BP / 0 MP<br>D: 1 9 8 → 0 BP / 2 MP',['728','629','129','726'],'728','3,4,5 absents. C fixe un BP parmi 7,2,8. D montre 1 et 8 mal places. Le code coherent est 728.','deduction'],['A: 7 8 9 → 0 BP / 0 MP<br>B: 1 2 3 → 2 BP / 0 MP<br>C: 1 4 5 → 1 BP / 0 MP<br>D: 6 2 3 → 2 BP / 0 MP',['123','623','125','126'],'123','7,8,9 absents. B indique deux BP. C confirme 1 en position 1. D confirme 2 et 3 en positions 2 et 3.','BP'],['A: 1 5 9 → 0 BP / 0 MP<br>B: 2 3 4 → 0 BP / 2 MP<br>C: 3 6 7 → 1 BP / 0 MP<br>D: 8 4 2 → 0 BP / 2 MP',['632','734','642','637'],'637','1,5,9 absents. C donne un BP parmi 3,6,7. Les MP de B et D imposent 3 et 4/2 hors positions ; le code compatible propose est 637.','MP'],['A: 2 5 8 → 0 BP / 0 MP<br>B: 1 3 4 → 1 BP / 1 MP<br>C: 6 3 7 → 1 BP / 0 MP<br>D: 1 9 7 → 0 BP / 2 MP',['637','134','697','631'],'637','2,5,8 absents. C donne un BP. D force 1 ou 7 en mauvaise place ; avec B, 3 est en position 2 et 7 en position 3.','croisement'],['A: 4 5 6 → 0 BP / 0 MP<br>B: 1 2 3 → 0 BP / 2 MP<br>C: 7 1 8 → 1 BP / 0 MP<br>D: 2 8 9 → 0 BP / 2 MP',['718','729','812','791'],'718','4,5,6 absents. C donne un BP. Les lignes B et D indiquent des chiffres presents mal places ; le code coherent est 718.','contrainte'],['A: 1 2 7 → 0 BP / 0 MP<br>B: 3 4 5 → 1 BP / 1 MP<br>C: 6 4 8 → 1 BP / 0 MP<br>D: 3 9 8 → 0 BP / 2 MP',['648','345','649','358'],'648','1,2,7 absents. C fixe un BP. D montre 3 et 8 presents mal places, ce qui conduit a 6,4,8.','BP'],['A: 8 9 0 → 0 BP / 0 MP<br>B: 1 2 3 → 1 BP / 0 MP<br>C: 4 2 5 → 1 BP / 1 MP<br>D: 1 6 5 → 2 BP / 0 MP',['165','125','625','163'],'165','8,9,0 absents. D donne deux BP. Avec B, 1 est bien place ; avec C, 5 est present.','simple'],['A: 1 4 7 → 0 BP / 0 MP<br>B: 2 5 8 → 1 BP / 1 MP<br>C: 2 6 9 → 0 BP / 1 MP<br>D: 3 5 9 → 2 BP / 0 MP',['359','258','356','659'],'359','1,4,7 absents. D donne 2 BP. C montre 9 present mais mal place ou 2/6 ; le croisement fixe 5 et 9 avec 3.','croisement'],['A: 2 3 8 → 0 BP / 0 MP<br>B: 1 4 5 → 1 BP / 1 MP<br>C: 6 4 7 → 1 BP / 0 MP<br>D: 1 9 7 → 0 BP / 2 MP',['647','149','697','547'],'647','2,3,8 absents. C donne un BP. D impose 1 et 7 mal places ; le code compatible est 647.','MP'],['A: 3 6 9 → 0 BP / 0 MP<br>B: 1 2 4 → 2 BP / 0 MP<br>C: 5 2 7 → 1 BP / 1 MP<br>D: 1 8 7 → 1 BP / 0 MP',['124','127','527','187'],'124','3,6,9 absents. B donne deux BP. Les autres lignes eliminent les mauvaises options.','BP'],['A: 4 8 0 → 0 BP / 0 MP<br>B: 1 2 3 → 0 BP / 2 MP<br>C: 5 1 6 → 1 BP / 0 MP<br>D: 2 6 7 → 0 BP / 2 MP',['516','713','562','613'],'516','4,8,0 absents. C donne un BP. Les deux lignes avec MP imposent les autres chiffres hors position.','systeme simple'],['A: 1 3 5 → 0 BP / 0 MP<br>B: 2 4 6 → 1 BP / 1 MP<br>C: 7 4 8 → 1 BP / 0 MP<br>D: 2 9 8 → 0 BP / 2 MP',['748','246','798','642'],'748','1,3,5 absents. C donne un BP. D force des presents mal places.','croisement'],['A: 6 7 8 → 0 BP / 0 MP<br>B: 1 2 3 → 1 BP / 1 MP<br>C: 4 2 9 → 1 BP / 0 MP<br>D: 1 5 9 → 0 BP / 2 MP',['429','123','459','329'],'429','6,7,8 absents. C fixe un BP. D indique deux presents mal places ; croisement avec B.','MP'],['A: 2 6 0 → 0 BP / 0 MP<br>B: 1 3 4 → 2 BP / 0 MP<br>C: 5 3 7 → 1 BP / 1 MP<br>D: 1 8 7 → 1 BP / 0 MP',['134','137','537','187'],'134','2,6,0 absents. B donne deux BP. C et D permettent de conserver 1 et 3 bien places, puis 4.','BP'],['A: 1 9 8 → 0 BP / 0 MP<br>B: 2 3 4 → 1 BP / 1 MP<br>C: 5 3 6 → 1 BP / 0 MP<br>D: 2 7 6 → 0 BP / 2 MP',['536','234','572','436'],'536','1,9,8 absents. C donne un BP. D donne deux presents mal places.','niveau 1'],['A: 4 7 9 → 0 BP / 0 MP<br>B: 1 2 3 → 1 BP / 1 MP<br>C: 5 2 6 → 1 BP / 0 MP<br>D: 1 8 6 → 0 BP / 2 MP',['526','123','582','623'],'526','4,7,9 absents. C fixe un BP. D et B imposent les autres chiffres par croisement.','final']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><div class="qtop"><span class="num">Question ${i+1}</span><span class="skill">${x[4]}</span></div><div class="case">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Reponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
