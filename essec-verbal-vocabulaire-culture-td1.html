<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Vocabulaire, expressions & culture</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.03rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 3</span><h1>TD 1 — Niveau 1</h1><p class="muted">QCM moyen/difficile : expressions françaises, proverbes, racines, préfixes et déductions lexicales.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[['Que signifie « mettre de l’eau dans son vin » ?',['Renoncer à tout','Modérer sa position','Mentir habilement','Aggraver un conflit'],'Modérer sa position','L’expression signifie devenir plus conciliant, moins radical.'],['Que signifie « jouer la montre » ?',['Gagner volontairement du temps','Accélérer une décision','Perdre une occasion','Refuser une règle'],'Gagner volontairement du temps','On retarde volontairement l’issue d’une situation.'],['Que signifie « remettre les pendules à l’heure » ?',['Rétablir les faits','Reporter une échéance','Changer de stratégie','Reconnaître une faute'],'Rétablir les faits','L’expression signifie clarifier une situation, corriger une version erronée.'],['« Avoir gain de cause » signifie :',['Obtenir satisfaction','Perdre un procès','Convaincre sans preuve','Faire pression'],'Obtenir satisfaction','On obtient ce qu’on réclamait après un désaccord.'],['Le proverbe « Qui ne tente rien n’a rien » défend surtout :',['La prise d’initiative','La prudence excessive','Le refus du risque','La patience passive'],'La prise d’initiative','Il souligne qu’un résultat suppose d’agir.'],['« La nuit porte conseil » signifie :',['Le recul aide à décider','Il faut agir immédiatement','Le doute est inutile','La fatigue rend lucide'],'Le recul aide à décider','Le temps et la distance permettent une décision plus réfléchie.'],['« Le mieux est l’ennemi du bien » critique :',['Le perfectionnisme excessif','La paresse','L’improvisation','La modestie'],'Le perfectionnisme excessif','À vouloir trop améliorer, on risque de dégrader ou de bloquer.'],['« Les murs ont des oreilles » invite à :',['La prudence dans la parole','La rapidité','La franchise absolue','L’humour'],'La prudence dans la parole','On rappelle que quelqu’un peut entendre ce qui est dit.'],['La racine « chrono » renvoie à :',['Le temps','La vie','Le peuple','La peur'],'Le temps','Chronologie, chronomètre, chronophage.'],['Le mot « bibliophile » désigne quelqu’un qui :',['Aime les livres','Étudie les animaux','Craint les bibliothèques','Écrit très vite'],'Aime les livres','bibli = livre ; phile = qui aime.'],['« Hydrophobe » signifie littéralement :',['Qui repousse/craint l’eau','Qui étudie l’eau','Qui produit de l’eau','Qui manque d’eau'],'Qui repousse/craint l’eau','hydro = eau ; phobe = crainte/rejet.'],['« Anthropologie » concerne :',['L’étude de l’humain','L’étude des astres','La peur du peuple','Le pouvoir technique'],'L’étude de l’humain','anthropo = humain ; logie = étude.'],['Le préfixe « post- » signifie :',['Après','Avant','Contre','Entre'],'Après','Exemples : postérieur, posthume.'],['« Autodidacte » désigne quelqu’un qui :',['Apprend par lui-même','Refuse d’apprendre','Enseigne aux autres','Étudie le vivant'],'Apprend par lui-même','auto = soi-même.'],['« Antithèse » indique principalement :',['Une opposition','Une répétition','Une origine','Une mesure'],'Une opposition','anti = contre ; thèse = position.'],['« Interdépendance » suppose :',['Une dépendance réciproque','Une indépendance totale','Une opposition violente','Une suite chronologique'],'Une dépendance réciproque','inter = entre ; dépendance mutuelle.'],['Que signifie « faire cavalier seul » ?',['Agir seul','Changer d’avis','Accuser publiquement','Réussir facilement'],'Agir seul','Expression d’isolement stratégique ou volontaire.'],['Que signifie « mettre sur la sellette » ?',['Exposer à la critique','Féliciter publiquement','Faire patienter','Protéger discrètement'],'Exposer à la critique','La personne est placée en position d’être jugée/questionnée.'],['« Battre le fer pendant qu’il est chaud » signifie :',['Agir au moment opportun','Travailler sans relâche','Corriger tardivement','Éviter le conflit'],'Agir au moment opportun','Il faut profiter d’un contexte favorable.'],['« On récolte ce que l’on sème » renvoie à :',['La responsabilité des actes','La chance','La transmission familiale','L’apparence trompeuse'],'La responsabilité des actes','Les conséquences découlent des choix passés.'],['La racine « morph » renvoie à :',['La forme','Le son','La chaleur','Le pouvoir'],'La forme','Morphologie, polymorphe.'],['« Technocratie » signifie littéralement :',['Pouvoir des techniciens/experts','Étude des techniques','Peur du progrès','Amour des machines'],'Pouvoir des techniciens/experts','techno = technique ; cratie = pouvoir.'],['« Macroéconomie » renvoie plutôt :',['Aux grands agrégats économiques','Aux petites unités','À l’histoire économique','À la peur de l’économie'],'Aux grands agrégats économiques','macro = grand, global.'],['« Géothermie » combine :',['Terre + chaleur','Terre + écriture','Vie + chaleur','Eau + peuple'],'Terre + chaleur','géo = terre ; thermo = chaleur.'],['« Faire preuve de sang-froid » signifie :',['Rester maître de soi','Être indifférent','Être brutal','Refuser d’aider'],'Rester maître de soi','Expression de maîtrise émotionnelle sous pression.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong><br>${q[3]}</div></details></div>`).join('');</script></body></html>
