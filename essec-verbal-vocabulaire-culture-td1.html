<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 1 — Vocabulaire, expressions & culture</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.03rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 3</span><h1>TD 1 — Niveau 1 renforcé</h1><p class="muted">Niveau moyen/difficile réel : expressions en contexte, proverbes reformulés, racines à déduire et distracteurs proches.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[['Dans une réunion tendue, “mettre de l’eau dans son vin” signifie surtout :',['renoncer sans condition','adopter une position plus conciliante','déplacer le sujet du débat','reconnaître publiquement une faute'],'adopter une position plus conciliante','L’idée n’est pas l’abandon, mais l’atténuation d’une position trop ferme.'],['“Couper l’herbe sous le pied” implique :',['anticiper l’action de quelqu’un pour la neutraliser','accélérer une décision attendue','critiquer quelqu’un frontalement','refuser une proposition par principe'],'anticiper l’action de quelqu’un pour la neutraliser','Il y a une idée de devancement stratégique qui empêche l’autre d’agir.'],['“Souffler le chaud et le froid” décrit une attitude :',['contradictoire et déstabilisante','prudemment mesurée','clairement hostile','volontairement silencieuse'],'contradictoire et déstabilisante','La personne alterne signes favorables et défavorables.'],['“Être en porte-à-faux” signifie :',['être dans une position fragile ou contradictoire','être au centre d’une décision','être protégé par une autorité','être en avance sur ses concurrents'],'être dans une position fragile ou contradictoire','L’expression renvoie à un déséquilibre, souvent logique ou politique.'],['“Remettre les pendules à l’heure” revient à :',['rétablir une vérité ou clarifier une situation','reporter une décision importante','accélérer une négociation','changer de méthode sans prévenir'],'rétablir une vérité ou clarifier une situation','Ce n’est pas seulement corriger une heure : c’est rétablir les faits.'],['Le proverbe “l’occasion fait le larron” signifie que :',['le contexte peut favoriser une faute','la faute révèle toujours un caractère mauvais','le hasard explique toute réussite','la prudence empêche toute erreur'],'le contexte peut favoriser une faute','Le proverbe insiste sur le rôle de l’opportunité dans la tentation.'],['“Le mieux est l’ennemi du bien” critique surtout :',['la recherche excessive de perfection','le manque d’ambition','l’acceptation de la médiocrité','la lenteur administrative'],'la recherche excessive de perfection','Le perfectionnisme peut bloquer ou détériorer un résultat déjà satisfaisant.'],['“Chacun voit midi à sa porte” renvoie à :',['un jugement guidé par son propre intérêt','une vérité universelle partagée','une décision prise trop tard','une forme de modestie intellectuelle'],'un jugement guidé par son propre intérêt','Le proverbe dénonce la subjectivité intéressée.'],['“Chat échaudé craint l’eau froide” exprime :',['une méfiance née d’une expérience passée','une peur irrationnelle de toute nouveauté','une incapacité à apprendre','un excès de confiance après l’échec'],'une méfiance née d’une expérience passée','Une expérience douloureuse rend prudent, parfois excessivement.'],['“Battre le fer pendant qu’il est chaud” invite à :',['agir au moment favorable','corriger une erreur ancienne','travailler avec régularité','éviter un conflit ouvert'],'agir au moment favorable','Le proverbe insiste sur le timing de l’action.'],['Dans “chronophage”, l’élément “-phage” suggère :',['qui consomme','qui aime','qui mesure','qui protège'],'qui consomme','Chronophage = qui consomme du temps.'],['“Polymorphe” signifie :',['qui prend plusieurs formes','qui refuse les formes établies','qui étudie les formes','qui possède une forme stable'],'qui prend plusieurs formes','poly = plusieurs ; morph = forme.'],['“Misanthrope” doit être rapproché de :',['haine/rejet de l’humain','peur du peuple','étude des sociétés','amour de la solitude uniquement'],'haine/rejet de l’humain','miso = haine ; anthropo = humain. La solitude peut être une conséquence, pas la définition.'],['“Technocratie” désigne :',['un pouvoir exercé par des experts techniques','une étude théorique de la technique','un rejet des machines','un gouvernement par le peuple'],'un pouvoir exercé par des experts techniques','techno = technique ; cratie = pouvoir.'],['Le mot “anachronique” indique :',['un décalage temporel','une accélération du temps','une méthode ancienne mais valide','une opposition au progrès'],'un décalage temporel','chrono renvoie au temps ; anachronique = placé hors de son époque.'],['“Hydrophile” signifie plutôt :',['qui a une affinité avec l’eau','qui rejette l’eau','qui mesure l’eau','qui vit uniquement dans l’eau'],'qui a une affinité avec l’eau','hydro = eau ; phile = qui aime / affinité.'],['“Autarcie” se distingue d’“autonomie” car elle désigne surtout :',['une autosuffisance fermée','une liberté de décision','une opposition politique','une dépendance réciproque'],'une autosuffisance fermée','Autonomie = se gouverner ; autarcie = se suffire à soi-même, souvent fermé aux échanges.'],['Le préfixe “inter-” dans “interdépendance” insiste sur :',['la réciprocité entre éléments','la succession dans le temps','l’opposition frontale','l’intériorité psychologique'],'la réciprocité entre éléments','Inter = entre ; l’interdépendance est une dépendance mutuelle.'],['“Posthume” signifie :',['qui survient après la mort','qui précède la naissance','qui appartient au passé lointain','qui est publié anonymement'],'qui survient après la mort','post = après ; posthume concerne l’après-mort.'],['“Périphérique” renvoie à :',['ce qui se situe autour','ce qui est central','ce qui est excessif','ce qui est antérieur'],'ce qui se situe autour','péri = autour.'],['“Noyer le poisson” signifie :',['rendre volontairement le sujet confus','échouer à comprendre une question','éviter tout conflit','répondre trop brièvement'],'rendre volontairement le sujet confus','Il y a une intention d’embrouiller pour esquiver.'],['“Avoir plusieurs cordes à son arc” signifie :',['disposer de plusieurs compétences ou options','changer facilement de camp','agir seul contre tous','être sous pression'],'disposer de plusieurs compétences ou options','L’expression renvoie à la polyvalence.'],['“Les petits ruisseaux font les grandes rivières” valorise :',['l’accumulation progressive','la rupture brutale','la chance initiale','la supériorité du collectif sur l’individu'],'l’accumulation progressive','De petites contributions peuvent produire un résultat important.'],['“Nul n’est prophète en son pays” signifie :',['on est parfois moins reconnu dans son propre milieu','un expert ne peut jamais convaincre','la vérité vient toujours de l’étranger','la proximité empêche toute compétence'],'on est parfois moins reconnu dans son propre milieu','Le proverbe concerne la reconnaissance sociale, pas la compétence.'],['“Mettre cartes sur table” signifie :',['révéler clairement ses intentions ou informations','renoncer à négocier','prendre un avantage secret','changer brutalement de stratégie'],'révéler clairement ses intentions ou informations','L’image renvoie à la transparence dans un échange.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong><br>${q[3]}</div></details></div>`).join('');</script></body></html>
