<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 2 — Analogies verbales</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.05rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 2</span><h1>TD 2 — Niveau difficile</h1><p class="muted">Analogies plus abstraites avec pièges de logique, inversion et niveau d’abstraction.</p></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[['DOGME : PENSÉE',['censure : parole','chaîne : liberté','prison : détenu','calomnie : réputation'],'chaîne : liberté','Le dogme limite/enferme la pensée ; la chaîne limite la liberté.'],['BISTOURI : CHIRURGIEN',['craie : professeur','microscope : biologiste','marteau : clou','scalpel : opération'],'microscope : biologiste','Outil spécialisé utilisé par un professionnel spécifique.'],['MÉMOIRE : OUBLI',['vue : aveuglement','sommeil : insomnie','silence : bruit','force : faiblesse'],'sommeil : insomnie','Fonction normale perturbée par un trouble précis.'],['RUCHE : ABEILLES',['bergerie : moutons','forêt : arbres','nid : oiseau','prairie : vaches'],'bergerie : moutons','Lieu construit/spécifique destiné à accueillir un groupe précis.'],['BROUILLON : ROMAN',['croquis : tableau','bande-annonce : film','esquisse : sculpture','prologue : récit'],'esquisse : sculpture','Version préparatoire avant l’œuvre finale.'],['VENIN : SERPENT',['griffe : lion','toile : araignée','corne : taureau','bec : aigle'],'toile : araignée','Substance/outil de capture produit naturellement par l’animal.'],['ÉPIDÉMIE : CONTAGION',['guerre : violence','crise : économie','incendie : fumée','sécheresse : chaleur'],'guerre : violence','Phénomène → mécanisme central qui le caractérise.'],['DICTÉE : ORTHOGRAPHE',['course : vitesse','problème : logique','interrogation : mémoire','dissertation : argumentation'],'dissertation : argumentation','Exercice visant principalement à évaluer une compétence donnée.'],['ÉCORCE : ARBRE',['carapace : tortue','peau : humain','mur : maison','toit : immeuble'],'carapace : tortue','Couche protectrice extérieure naturelle.'],['MÉTRO : STATION',['avion : piste','train : gare','bus : ticket','taxi : client'],'train : gare','Moyen de transport → lieu normal d’arrêt/départ.'],['SATIRE : MOQUERIE',['éloge : admiration','pamphlet : attaque','roman : lecture','tragédie : émotion'],'pamphlet : attaque','Genre/forme d’expression → intention dominante.'],['LUCIOLE : LUMIÈRE',['volcan : lave','soleil : chaleur','lampe : électricité','étoile : nuit'],'volcan : lave','Élément produisant naturellement quelque chose.'],['SCULPTEUR : MARBRE',['pâtissier : farine','couturier : tissu','menuisier : bois','écrivain : stylo'],'menuisier : bois','Profession travaillant une matière première spécifique.'],['BIBLIOTHÈQUE : SILENCE',['tribunal : justice','hôpital : soin','stade : bruit','musée : tableau'],'stade : bruit','Lieu fortement associé à une caractéristique dominante.'],['RIVIÈRE : SOURCE',['arbre : racine','phrase : mot','bâtiment : fondation','montagne : sommet'],'arbre : racine','Élément provenant d’une origine/source naturelle.']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong><br>${q[3]}</div></details></div>`).join('');</script></body></html>
