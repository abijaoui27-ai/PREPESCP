<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 2 — Logique verbale ESSEC</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:12px;line-height:1.4}nav{position:fixed;top:0;left:0;right:0;background:rgba(7,7,12,.96);padding:17px 48px;border-bottom:1px solid rgba(201,169,110,.08);display:flex;justify-content:space-between;align-items:center;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.mid{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:6px 14px}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1160px;margin:auto;padding:92px 24px 55px}.hero,.panel{background:var(--surface);border:1px solid var(--border);padding:25px 32px;margin-bottom:16px}.hero{border-top:2px solid #0055b3}h1{font-family:'Cormorant Garamond',serif;font-size:2.3rem;margin:8px 0}.muted{color:var(--muted)}.tag{display:inline-block;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 9px;margin:4px 4px 0 0;font-size:.62rem;text-transform:uppercase;letter-spacing:1.4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:14px}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.num{color:var(--gold);font-weight:700}.type{font-size:.58rem;letter-spacing:1.2px;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:4px 7px;text-transform:uppercase}.question{font-size:.94rem;font-weight:600;margin:8px 0 10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{padding:8px;border:1px solid rgba(201,169,110,.1);background:rgba(255,255,255,.015);color:#b4aec2}summary{cursor:pointer;color:#c9a96e;margin-top:10px;font-weight:600}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;margin-top:8px;color:#c9f7dc}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:16px}@media(max-width:800px){nav{padding:15px 18px}.mid{display:none}.main{padding:78px 14px}.hero,.panel{padding:20px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><div class="mid">ESSEC — TD 2</div><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 5</span><h1>TD 2 — Niveau très difficile</h1><p class="muted">QCM mélangés, très exigeants : implicites complexes, doubles négations, nuances fines, syntaxe, intrus subtils et distracteurs très proches.</p><span class="tag">36 questions</span><span class="tag">Très difficile</span></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour à l'espace psychotechnique</a></section></main><script>const Q=[
{t:'implicite',q:'« L’auteur prétend déconstruire les évidences ; il se contente souvent d’inverser des certitudes sans les interroger réellement. »',o:['Il produit une critique superficielle.','Il refuse toute remise en question.','Il valide les évidences initiales.','Il adopte une méthode scientifique rigoureuse.'],r:'A. Il produit une critique superficielle.',c:'Le texte critique une inversion mécanique plutôt qu’une vraie analyse.'},
{t:'phrase',q:'Cette argumentation gagne en sophistication ce qu’elle perd en ____.',o:['lisibilité','complexité','cohérence','érudition'],r:'A. lisibilité',c:'L’opposition suggère un discours plus sophistiqué mais moins clair.'},
{t:'intrus',q:'Quel est l’intrus ?',o:['équivoque','ambigu','univoque','polysémique'],r:'C. univoque',c:'Les trois autres renvoient à une pluralité de sens.'},
{t:'négation',q:'« On ne saurait exclure cette hypothèse » signifie :',o:['Cette hypothèse est impossible.','Cette hypothèse reste envisageable.','Cette hypothèse est certaine.','Cette hypothèse est absurde.'],r:'B. Cette hypothèse reste envisageable.',c:'On ne peut pas l’écarter : elle demeure possible.'},
{t:'syntaxe',q:'Encore faudrait-il que cette réforme ____ applicable dans un contexte réel.',o:['sera','soit','est','était'],r:'B. soit',c:'Après « faudrait-il que », on utilise le subjonctif.'},
{t:'nuance',q:'Le terme le plus proche de « spécieux » est :',o:['fallacieux','mesuré','limpide','circonspect'],r:'A. fallacieux',c:'Un raisonnement spécieux paraît convaincant mais est trompeur.'},
{t:'phrase',q:'Sous des dehors méthodiques, ce raisonnement demeure profondément ____.',o:['erratique','cohérent','exhaustif','nuancé'],r:'A. erratique',c:'Le contraste oppose apparence de méthode et désordre réel.'},
{t:'connecteur',q:'« Les indicateurs progressent ; ____, les inégalités persistent. »',o:['par conséquent','néanmoins','ainsi','dès lors'],r:'B. néanmoins',c:'On oppose deux constats.'},
{t:'implicite',q:'« L’étude multiplie les précautions oratoires avant chaque conclusion. »',o:['Les auteurs cherchent à éviter toute contestation.','Les auteurs manquent totalement de méthode.','Les auteurs refusent de conclure.','Les auteurs sont nécessairement incompétents.'],r:'A. Les auteurs cherchent à éviter toute contestation.',c:'Les précautions oratoires servent souvent à anticiper les objections.'},
{t:'suite',q:'Observer → conceptualiser → modéliser → ?',o:['formaliser','digresser','nier','contourner'],r:'A. formaliser',c:'La progression mène vers une formulation plus abstraite et structurée.'},
{t:'intrus',q:'Quel est l’intrus ?',o:['tempérer','nuancer','radicaliser','modérer'],r:'C. radicaliser',c:'Les autres verbes limitent ou adoucissent.'},
{t:'phrase',q:'L’auteur adopte une posture critique qui vire parfois à la ____ systématique.',o:['complaisance','contestation','lucidité','neutralité'],r:'B. contestation',c:'Le texte suggère une critique devenue automatique.'},
{t:'implicite',q:'« À force de vouloir tout contextualiser, le texte finit par dissoudre toute possibilité de jugement. »',o:['Le texte refuse toute nuance.','Le texte relativise excessivement.','Le texte est dogmatique.','Le texte simplifie les problèmes.'],r:'B. Le texte relativise excessivement.',c:'Le reproche porte sur un excès de contextualisation qui empêche de trancher.'},
{t:'syntaxe',q:'Aucune des solutions proposées ne semble réellement capable de ____ le problème.',o:['résolvant','résoudre','résolue','résolution'],r:'B. résoudre',c:'Après « capable de », on attend l’infinitif.'},
{t:'nuance',q:'« Lapidaire » signifie surtout :',o:['extrêmement bref','contradictoire','émotionnel','imprécis'],r:'A. extrêmement bref',c:'Une formule lapidaire est concise, parfois tranchante.'},
{t:'phrase',q:'Le rapport donne une impression de maîtrise qui masque difficilement son caractère ____.',o:['approximatif','méthodique','exhaustif','structuré'],r:'A. approximatif',c:'Le contraste oppose l’apparence de maîtrise et le manque de précision réel.'},
{t:'implicite',q:'« L’intervenant répond longuement sans jamais traiter l’objection centrale. »',o:['Il maîtrise parfaitement le sujet.','Il contourne le cœur du problème.','Il simplifie volontairement le débat.','Il apporte une preuve décisive.'],r:'B. Il contourne le cœur du problème.',c:'Le texte critique une stratégie d’évitement.'},
{t:'connecteur',q:'« Certes, l’analyse est stimulante ; ____, elle repose sur plusieurs présupposés fragiles. »',o:['en outre','néanmoins','ainsi','par conséquent'],r:'B. néanmoins',c:'Concession suivie d’une limite.'},
{t:'intrus',q:'Quel est l’intrus ?',o:['présupposé','sous-entendu','implicite','démonstration'],r:'D. démonstration',c:'Les trois premiers renvoient à l’implicite ; une démonstration est explicite.'},
{t:'phrase',q:'Cette conclusion paraît moins prudente que véritablement ____.',o:['péremptoire','nuancée','dubitative','mesurée'],r:'A. péremptoire',c:'Opposition entre prudence apparente et affirmation excessive.'},
{t:'négation',q:'« Il n’est pas impossible que cette stratégie échoue » signifie :',o:['Cette stratégie réussira forcément.','Cette stratégie pourrait échouer.','Cette stratégie est absurde.','Cette stratégie est impossible.'],r:'B. Cette stratégie pourrait échouer.',c:'Double négation = possibilité d’échec.'},
{t:'implicite',q:'« Les auteurs invoquent sans cesse l’urgence sans jamais définir précisément les priorités. »',o:['Le discours privilégie l’effet rhétorique.','Le discours est parfaitement opérationnel.','Les auteurs refusent toute émotion.','Les priorités sont très claires.'],r:'A. Le discours privilégie l’effet rhétorique.',c:'L’urgence est utilisée comme effet de discours sans contenu opérationnel.'},
{t:'suite',q:'Hypothèse → expérimentation → validation → ?',o:['généralisation','oubli','rétractation','digression'],r:'A. généralisation',c:'Après validation vient l’extension possible du modèle.'},
{t:'phrase',q:'Le raisonnement semble cohérent ; il repose pourtant sur une analogie particulièrement ____.',o:['fragile','probante','solide','rigoureuse'],r:'A. fragile',c:'Le connecteur « pourtant » annonce une faiblesse.'},
{t:'nuance',q:'Quel mot est le plus proche de « parcimonieux » ?',o:['avare','méthodique','abondant','brusque'],r:'A. avare',c:'Parcimonieux = qui donne peu, avec une retenue parfois excessive.'},
{t:'intrus',q:'Quel est l’intrus ?',o:['empirique','expérimental','théorique','pragmatique'],r:'C. théorique',c:'Les autres renvoient davantage au concret ou à l’expérience.'},
{t:'syntaxe',q:'Encore faut-il que les conditions ____ réunies pour appliquer ce modèle.',o:['soient','seront','sont','étaient'],r:'A. soient',c:'Subjonctif après « faut-il que ».'},
{t:'phrase',q:'Cette critique, présentée comme radicale, demeure en réalité étonnamment ____.',o:['conventionnelle','subversive','originale','audacieuse'],r:'A. conventionnelle',c:'Le contraste oppose radicalité affichée et banalité réelle.'},
{t:'implicite',q:'« Plus le texte avance, plus ses concepts semblent perdre en précision. »',o:['Le texte gagne en rigueur.','Le vocabulaire devient plus flou.','Le texte refuse les concepts.','Le texte devient purement narratif.'],r:'B. Le vocabulaire devient plus flou.',c:'Perdre en précision = devenir moins net, plus flou.'},
{t:'connecteur',q:'« La méthode paraît séduisante ; ____, son coût réel limite fortement son intérêt. »',o:['ainsi','cependant','par conséquent','de surcroît'],r:'B. cependant',c:'Opposition entre séduction théorique et limite pratique.'},
{t:'phrase',q:'Sous couvert de neutralité, cette analyse défend une position idéologique particulièrement ____.',o:['située','prudente','objective','marginale'],r:'A. située',c:'« Située » indique que la position est marquée par un point de vue particulier.'},
{t:'nuance',q:'Le terme opposé à « tacite » est :',o:['implicite','sous-entendu','explicite','latent'],r:'C. explicite',c:'Tacite = non formulé ; explicite = clairement formulé.'},
{t:'implicite',q:'« Le texte multiplie les exemples sans jamais discuter leur représentativité. »',o:['Le raisonnement généralise peut-être abusivement.','Les exemples sont forcément faux.','Le texte refuse toute donnée concrète.','Les exemples sont statistiquement irréprochables.'],r:'A. Le raisonnement généralise peut-être abusivement.',c:'Le problème porte sur la validité de la généralisation.'},
{t:'phrase',q:'Cette posture critique finit par devenir ____ tant elle refuse systématiquement toute concession.',o:['dogmatique','ouverte','mesurée','circonspecte'],r:'A. dogmatique',c:'Le refus systématique de concession mène au dogmatisme.'},
{t:'intrus',q:'Quel est l’intrus ?',o:['synthétique','concis','prolixe','lapidaire'],r:'C. prolixe',c:'Les autres indiquent la brièveté ; prolixe signifie long.'},
{t:'implicite',q:'« Le rapport privilégie les effets d’annonce aux mécanismes de mise en œuvre. »',o:['Le rapport manque de dimension opérationnelle.','Le rapport détaille précisément l’exécution.','Le rapport est purement technique.','Le rapport refuse toute communication.'],r:'A. Le rapport manque de dimension opérationnelle.',c:'Les annonces dominent l’application concrète.'}
];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="qtop"><div class="num">Question ${i+1}</div><div class="type">${q.t}</div></div><div class="question">${q.q}</div><div class="opts">${q.o.map((x,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${x}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q.r}</strong><br>${q.c}</div></details></div>`).join('');</script></body></html>
