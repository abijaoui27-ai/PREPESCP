<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD1 Culture verbale</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 1</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 5 — Culture verbale</div><h1>TD 1 — Sigles, genres & pièges de langue</h1><p class="muted">30 QCM intermédiaires difficiles pour sécuriser les questions courtes : sigles, genres, expressions correctes et paronymes fréquents.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Intermédiaire difficile</span><span class="tag">ESSEC</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['Que signifie INSEE ?',['Institut national de la statistique et des études économiques','Institut national supérieur des études européennes','Inspection nationale des services économiques','Institut numérique de statistiques européennes'],'Institut national de la statistique et des études économiques','Sigle très fréquent dans les textes économiques et sociaux.'],['Quel est le genre correct ?',['une tentacule','un tentacule','des tentacules féminines','la tentacule'],'un tentacule','Tentacule est masculin.'],['Quelle forme est correcte ?',['pallier à un problème','pallier un problème','pallier de un problème','pallier sur un problème'],'pallier un problème','Pallier est transitif direct.'],['Collision / collusion : que signifie collusion ?',['un choc','une entente secrète','une erreur de calcul','une opposition publique'],'une entente secrète','Collusion = accord secret, souvent frauduleux.'],['Que signifie BCE ?',['Banque commerciale européenne','Banque centrale européenne','Bureau central économique','Banque commune des États'],'Banque centrale européenne','Institution monétaire de la zone euro.'],['Quel mot est féminin ?',['un oasis','une oasis','un épitaphe','un orbite'],'une oasis','Oasis est féminin.'],['Quelle expression est préférable en concours ?',['par contre','en revanche','à contrario','malgré que'],'en revanche','En revanche est plus soutenu et plus sûr.'],['Conjecture signifie :',['situation économique','hypothèse','discours officiel','collision'],'hypothèse','À ne pas confondre avec conjoncture.'],['Que signifie OMC ?',['Organisation mondiale du commerce','Office monétaire central','Organisation médicale commune','Organisation mondiale de la culture'],'Organisation mondiale du commerce','Institution internationale liée au commerce.'],['Quel est le genre correct ?',['une haltère','un haltère','la haltère','une haltère lourde'],'un haltère','Haltère est masculin.'],['Quelle forme est correcte ?',['se rappeler de quelque chose','se rappeler quelque chose','se souvenir quelque chose','se mémoriser de quelque chose'],'se rappeler quelque chose','Se rappeler est construit directement.'],['Éminent signifie :',['proche dans le temps','remarquable','dangereux','caché'],'remarquable','Imminent = proche dans le temps.'],['Que signifie CNIL ?',['Commission nationale de l’informatique et des libertés','Centre national des industries locales','Conseil numérique international légal','Commission nationale de l’innovation linguistique'],'Commission nationale de l’informatique et des libertés','Autorité liée aux données personnelles.'],['Quel mot est masculin ?',['une astérisque','un astérisque','une apogée','une orbite'],'un astérisque','Astérisque est masculin.'],['Quelle forme est correcte ?',['après qu’il soit venu','après qu’il est venu','après qu’il vienne','après qu’il serait venu'],'après qu’il est venu','Après que appelle normalement l’indicatif.'],['Allocation signifie :',['discours','somme attribuée','entrée brusque','dommage moral'],'somme attribuée','Allocution = discours.'],['Que signifie OMS ?',['Organisation mondiale de la santé','Office médical supérieur','Organisation monétaire sanitaire','Ordre mondial de santé'],'Organisation mondiale de la santé','Institution internationale de santé.'],['Quel mot est féminin ?',['un interview','une interview','un échappatoire','un épitaphe'],'une interview','Interview est féminin.'],['Quelle expression est correcte ?',['par acquis de conscience','par acquit de conscience','par acquis de consciences','par acquis conscient'],'par acquit de conscience','Acquit renvoie à ce dont on s’acquitte.'],['Incidence signifie :',['événement ponctuel','conséquence ou répercussion','préjugé','infraction'],'conséquence ou répercussion','Incident = événement ; incidence = effet.'],['Que signifie GIEC ?',['Groupe d’experts intergouvernemental sur l’évolution du climat','Groupe international économique commun','Gouvernement intereuropéen du climat','Gestion internationale écologique climatique'],'Groupe d’experts intergouvernemental sur l’évolution du climat','Sigle essentiel en environnement.'],['Quel mot est masculin ?',['une pétale','un pétale','la pétale','une pétale fragile'],'un pétale','Pétale est masculin.'],['Quelle forme est correcte ?',['d’avantage de temps','davantage de temps','davantages de temps','d’avantages temps'],'davantage de temps','Davantage signifie plus.'],['Préjudice signifie :',['opinion préalable','dommage subi','discours','hypothèse'],'dommage subi','Préjugé = opinion préalable.'],['Que signifie OCDE ?',['Organisation de coopération et de développement économiques','Office central du développement européen','Organisation commune des droits économiques','Observatoire commercial des États développés'],'Organisation de coopération et de développement économiques','Attention au pluriel économiques.'],['Quel mot est féminin ?',['un espèce','une espèce','un acné','un idole'],'une espèce','Espèce est féminin.'],['Quelle expression est correcte ?',['des luttes intestinales','des luttes intestines','des luttes intérieures intestinales','des luttes internes intestinales'],'des luttes intestines','Intestin signifie interne au figuré.'],['Compréhensif signifie :',['clair','indulgent','difficile','objectif'],'indulgent','Compréhensible = clair.'],['Que signifie PME ?',['Petite et moyenne entreprise','Production moyenne européenne','Plan monétaire économique','Petite maison économique'],'Petite et moyenne entreprise','Sigle courant en économie et management.'],['Quel mot est féminin ?',['un orbite','une orbite','un apogée','un enzyme masculin exclusivement'],'une orbite','Orbite est féminin.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
