<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD1 Analogies</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 1</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 2 — Analogies</div><h1>TD 1 — Relations logiques difficiles</h1><p class="muted">30 QCM pour automatiser les relations classiques : outil, cause, conséquence, intensité, opposition, partie/tout.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Difficile</span><span class="tag">Verbal ESSEC</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['scalpel : inciser :: boussole : ?',['orienter','marcher','mesurer','observer'],'orienter','Relation outil → fonction précise.'],['incendie : fumée :: pluie : ?',['nuage','inondation','orage','vent'],'inondation','Cause → conséquence possible.'],['pétale : fleur :: chapitre : ?',['page','livre','auteur','titre'],'livre','Partie → tout.'],['soldat : armée :: musicien : ?',['instrument','orchestre','concert','partition'],'orchestre','Individu → groupe organisé.'],['marbre : statue :: bois : ?',['forêt','table','sculpteur','outil'],'table','Matière → objet fabriqué.'],['Molière : Tartuffe :: Flaubert : ?',['Candide','Madame Bovary','Phèdre','Germinal'],'Madame Bovary','Auteur → œuvre.'],['tribunal : juger :: école : ?',['apprendre','punir','écrire','gouverner'],'apprendre','Lieu/institution → fonction centrale.'],['agacement : fureur :: inquiétude : ?',['effroi','repos','joie','calme'],'effroi','Amplification d’intensité.'],['lâcheté : courage :: avarice : ?',['générosité','richesse','prudence','peur'],'générosité','Défaut → qualité opposée.'],['symptôme : maladie :: indice : ?',['preuve','enquête','hypothèse','juge'],'enquête','Signe exploité dans une recherche.'],['juge : sentence :: arbitre : ?',['sanction','terrain','maillot','match'],'sanction','Autorité → décision.'],['architecte : plan :: écrivain : ?',['brouillon','roman','papier','éditeur'],'roman','Agent → production.'],['volcan : lave :: source : ?',['eau','pierre','montagne','sel'],'eau','Lieu/source → élément émis.'],['remède : guérison :: étude : ?',['compréhension','oubli','livre','classe'],'compréhension','Moyen → effet recherché.'],['diplomate : négocier :: avocat : ?',['plaider','condamner','juger','opérer'],'plaider','Profession → action centrale.'],['laconique : brièveté :: prolixe : ?',['abondance','silence','colère','rigueur'],'abondance','Qualité de style → trait dominant.'],['vindicatif : vengeance :: cauteleux : ?',['méfiance','joie','vitesse','clarté'],'méfiance','Adjectif → disposition associée.'],['dilatoire : retard :: fallacieux : ?',['tromperie','vitesse','force','lumière'],'tromperie','Adjectif → effet ou nature.'],['graine : plante :: prémisse : ?',['conclusion','objection','exemple','mot'],'conclusion','Point de départ → développement/résultat.'],['thermomètre : température :: baromètre : ?',['pression','vitesse','distance','poids'],'pression','Instrument → mesure.'],['bibliothèque : livres :: ruche : ?',['abeilles','miel','fleurs','cire'],'abeilles','Contenant/lieu → occupants.'],['probité : honnêteté :: turpitude : ?',['bassesse','calme','savoir','mouvement'],'bassesse','Notion morale → définition proche.'],['opaque : transparent :: implicite : ?',['explicite','secret','clair','faux'],'explicite','Opposition stricte.'],['diagnostic : médecin :: verdict : ?',['juge','avocat','patient','témoin'],'juge','Production professionnelle → agent.'],['paradoxe : contradiction apparente :: euphémisme : ?',['atténuation','exagération','mensonge','répétition'],'atténuation','Figure/notion → définition.'],['ciseau : couper :: loupe : ?',['grossir','coller','plier','peser'],'grossir','Outil → fonction.'],['cendre : combustion :: ruine : ?',['destruction','construction','fortune','mémoire'],'destruction','Trace/résultat → cause.'],['brouillon : texte :: esquisse : ?',['dessin','musée','peintre','cadre'],'dessin','Version préparatoire → œuvre finale.'],['objection : débat :: preuve : ?',['démonstration','rumeur','opinion','silence'],'démonstration','Élément constitutif.'],['boussole : nord :: horloge : ?',['heure','jour','main','mur'],'heure','Instrument → repère indiqué.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
