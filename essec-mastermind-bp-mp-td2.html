<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="format-detection" content="telephone=no"><title>PrepOral - TD2 Mastermind</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0055b3;--blue2:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px;position:relative}.hero:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#003b7a,#0072e5)}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue2);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue2);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.panel{padding:22px 28px;margin-bottom:13px}.panel h2{font-family:'Cormorant Garamond',serif;font-size:1.38rem;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.qtop{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.num{color:var(--gold);font-weight:700}.skill{font-size:.56rem;color:var(--blue2);border:1px solid var(--blueborder);padding:3px 6px;text-transform:uppercase;letter-spacing:1px}.case{font-size:.8rem;color:var(--text);line-height:1.7;background:rgba(255,255,255,.025);border:1px solid rgba(201,169,110,.08);padding:9px;margin-bottom:10px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC - TD 2</div><a href="/essec-psycho.html" class="back">Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 3 - Mastermind BP / MP</div><h1>TD 2 - Codes niveau 2</h1><p class="muted">Codes a 4 ou 5 chiffres. Objectif : raisonner comme avec un systeme de contraintes et verifier toutes les lignes.</p><div class="toolbar"><span class="tag">16 questions</span><span class="tag">Niveau 2</span><span class="tag">Systemes</span></div></section><section class="panel"><h2>Questions</h2><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour a l'espace psychotechnique</a></section></main><script>const DATA=[['A: 1 2 3 4 → 0 BP / 0 MP<br>B: 5 6 7 8 → 2 BP / 0 MP<br>C: 5 9 0 8 → 1 BP / 1 MP<br>D: 6 7 8 5 → 0 BP / 4 MP',['5678','5687','6578','8765'],'5678','1,2,3,4 sont absents. B donne deux chiffres bien places parmi 5,6,7,8. D indique que les quatre chiffres 5,6,7,8 sont presents mais tous mal places dans D. Le code compatible est 5678.','4 chiffres'],['A: 0 1 2 3 → 0 BP / 0 MP<br>B: 4 5 6 7 → 1 BP / 2 MP<br>C: 4 8 9 7 → 2 BP / 0 MP<br>D: 5 6 7 4 → 0 BP / 4 MP',['4897','4567','5864','4967'],'4897','0,1,2,3 absents. C donne deux BP. D montre que 4,5,6,7 sont presents mais pas a ces places ; cela oblige a croiser avec B et C.','contraintes'],['A: 1 2 3 4 5 → 0 BP / 0 MP<br>B: 6 7 8 9 0 → 2 BP / 2 MP<br>C: 6 8 0 7 9 → 0 BP / 5 MP<br>D: 7 6 8 0 9 → 3 BP / 0 MP',['67890','76809','78609','76089'],'76809','1 a 5 absents. Le code est compose de 6,7,8,9,0. C donne 0 BP / 5 MP donc les cinq chiffres sont presents mais tous mal places. D donne trois BP.','5 chiffres'],['A: 9 8 7 6 → 0 BP / 0 MP<br>B: 1 2 3 4 → 1 BP / 1 MP<br>C: 1 5 6 7 → 1 BP / 0 MP<br>D: 0 2 4 5 → 2 BP / 1 MP',['1524','0235','1245','5204'],'1524','9,8,7,6 absents. C fixe un seul BP parmi 1 et 5. B et D permettent de croiser les positions restantes.','systeme'],['A: 1 3 5 7 9 → 0 BP / 0 MP<br>B: 2 4 6 8 0 → 2 BP / 1 MP<br>C: 2 6 0 4 8 → 1 BP / 4 MP<br>D: 4 2 6 0 8 → 3 BP / 0 MP',['24680','42608','42068','26408'],'42608','Les chiffres impairs sont absents. Les pairs sont dans le code. C indique que presque tous sont mal places ; D fixe trois positions.','5 chiffres'],['A: A B C D → 0 BP / 0 MP<br>B: E F G H → 1 BP / 2 MP<br>C: E I J H → 2 BP / 0 MP<br>D: F G H E → 0 BP / 4 MP',['EIJH','EFGH','FGEH','HGFE'],'EIJH','A,B,C,D absents. C donne deux BP parmi E,I,J,H. D impose que E,F,G,H sont presents mais deplaces.','lettres'],['A: 0 2 4 6 → 0 BP / 0 MP<br>B: 1 3 5 7 → 2 BP / 1 MP<br>C: 1 8 9 7 → 1 BP / 1 MP<br>D: 3 5 7 1 → 0 BP / 4 MP',['1357','1857','3157','7315'],'1357','Les pairs de A sont absents. D montre que 1,3,5,7 sont les bons chiffres mais dans un autre ordre. Les autres lignes fixent le bon ordre.','ordre'],['A: 1 2 3 4 5 → 1 BP / 0 MP<br>B: 6 7 8 9 0 → 0 BP / 4 MP<br>C: 2 6 7 8 9 → 1 BP / 3 MP<br>D: 1 6 8 0 9 → 2 BP / 2 MP',['16789','26890','12679','86790'],'16789','Chaque ligne donne une contrainte partielle. A garde un seul chiffre bien place. Les lignes B,C,D placent les chiffres 6,7,8,9 autour de cette contrainte.','avance'],['A: 5 4 3 2 → 0 BP / 0 MP<br>B: 1 6 7 8 → 1 BP / 2 MP<br>C: 1 9 0 8 → 2 BP / 0 MP<br>D: 6 7 8 1 → 0 BP / 4 MP',['1908','1678','6781','1978'],'1908','5,4,3,2 absents. C donne deux BP. D confirme que 1,6,7,8 sont tous presents mais mal places dans D.','BP/MP'],['A: 0 1 2 3 4 → 0 BP / 0 MP<br>B: 5 6 7 8 9 → 1 BP / 3 MP<br>C: 5 8 9 6 7 → 0 BP / 5 MP<br>D: 6 5 7 9 8 → 2 BP / 2 MP',['65789','56789','75698','68795'],'65789','0 a 4 absents. C montre que 5,8,9,6,7 sont presents mais tous mal places. D fixe deux positions.','5 chiffres'],['A: 8 1 6 3 → 0 BP / 0 MP<br>B: 2 4 5 7 → 2 BP / 1 MP<br>C: 2 9 0 7 → 1 BP / 1 MP<br>D: 4 5 7 2 → 0 BP / 4 MP',['2457','2907','4527','7254'],'2457','8,1,6,3 absents. D confirme les chiffres 2,4,5,7 mais tous mal places. B fixe deux positions.','systeme'],['A: 1 2 3 4 → 1 BP / 1 MP<br>B: 5 6 7 8 → 0 BP / 0 MP<br>C: 1 9 0 4 → 2 BP / 0 MP<br>D: 2 0 4 9 → 0 BP / 4 MP',['1904','1204','9041','2409'],'1904','5,6,7,8 absents. C fixe deux BP. D montre que 2,0,4,9 sont tous presents mais mal places dans D.','croisement'],['A: 1 3 5 7 → 0 BP / 0 MP<br>B: 2 4 6 8 → 1 BP / 2 MP<br>C: 2 9 0 8 → 2 BP / 0 MP<br>D: 4 6 8 2 → 0 BP / 4 MP',['2908','2468','4682','2698'],'2908','Les impairs de A sont absents. D confirme que 2,4,6,8 sont presents et deplaces. C fixe 2 et 8.','niveau 2'],['A: 7 0 1 2 3 → 0 BP / 0 MP<br>B: 4 5 6 8 9 → 2 BP / 2 MP<br>C: 4 8 9 5 6 → 0 BP / 5 MP<br>D: 5 4 6 9 8 → 3 BP / 0 MP',['54698','45689','54896','46985'],'54698','7,0,1,2,3 absents. C montre que les cinq chiffres sont presents mais mal places. D fixe trois positions.','5 chiffres'],['A: 1 2 3 4 → 0 BP / 0 MP<br>B: 5 6 7 8 → 1 BP / 2 MP<br>C: 9 6 0 8 → 2 BP / 0 MP<br>D: 6 7 8 5 → 0 BP / 4 MP',['9608','5678','6785','9678'],'9608','1,2,3,4 absents. C donne deux BP. D confirme que 5,6,7,8 existent mais tous mal places.','final'],['A: 2 4 6 8 0 → 0 BP / 0 MP<br>B: 1 3 5 7 9 → 2 BP / 2 MP<br>C: 1 7 9 3 5 → 0 BP / 5 MP<br>D: 3 1 5 9 7 → 3 BP / 0 MP',['31597','13579','31795','97135'],'31597','Tous les pairs sont absents. C donne 0 BP / 5 MP donc les cinq impairs sont presents mais tous deplaces. D fixe trois positions.','systeme final']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><div class="qtop"><span class="num">Question ${i+1}</span><span class="skill">${x[4]}</span></div><div class="case">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Reponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
