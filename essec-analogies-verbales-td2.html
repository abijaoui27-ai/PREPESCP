<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD2 Analogies</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 2</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 2 — Analogies</div><h1>TD 2 — Analogies très difficiles</h1><p class="muted">30 QCM très sélectifs : relations abstraites, concepts, vocabulaire soutenu, pièges d’inversion.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Très difficile</span><span class="tag">ESSEC</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['syllogisme : conclusion :: prémisse : ?',['argument','point de départ','contradiction','exemple'],'point de départ','Relation élément logique → rôle dans le raisonnement.'],['cauteleux : méfiance :: velléitaire : ?',['volonté inaboutie','courage','violence','joie'],'volonté inaboutie','Adjectif → disposition morale précise.'],['euphémisme : atténuation :: hyperbole : ?',['exagération','mensonge','silence','doute'],'exagération','Figure de style → opération rhétorique.'],['ostracisme : exclusion :: mansuétude : ?',['indulgence','vengeance','rapidité','honte'],'indulgence','Notion soutenue → définition.'],['objection : réfutation :: accusation : ?',['défense','preuve','juge','loi'],'défense','Énoncé contestataire → réponse.'],['sophisme : raisonnement :: mirage : ?',['perception','voyage','désert','lumière'],'perception','Version trompeuse d’une faculté.'],['anachronisme : temps :: contresens : ?',['interprétation','vitesse','mémoire','langage'],'interprétation','Erreur relative à un domaine.'],['antidote : poison :: démenti : ?',['rumeur','journal','preuve','discours'],'rumeur','Moyen de neutralisation.'],['probe : turpitude :: limpide : ?',['abscons','clair','diaphane','obvie'],'abscons','Opposition morale puis opposition de clarté.'],['exorde : discours :: préambule : ?',['texte','loi','titre','page'],'texte','Partie introductive → ensemble.'],['épilogue : récit :: conclusion : ?',['démonstration','hypothèse','prémisse','objection'],'démonstration','Fin structurante → ensemble argumentatif.'],['allégorie : idée :: symbole : ?',['concept','signe','image','texte'],'concept','Représentation concrète → abstraction.'],['dilatoire : délai :: coercitif : ?',['contrainte','douceur','erreur','richesse'],'contrainte','Adjectif → effet recherché.'],['laconique : concision :: amphigourique : ?',['confusion','brièveté','beauté','sincérité'],'confusion','Style → effet dominant.'],['indice : enquête :: symptôme : ?',['diagnostic','remède','patient','médecin'],'diagnostic','Signe → processus d’interprétation.'],['axiome : démonstration :: postulat : ?',['théorie','preuve','évidence','exemple'],'théorie','Principe admis → construction intellectuelle.'],['censure : expression :: embargo : ?',['commerce','justice','armée','météo'],'commerce','Restriction appliquée à un domaine.'],['amnistie : peine :: grâce : ?',['condamnation','pardon','faute','tribunal'],'condamnation','Acte juridique → ce qu’il efface ou adoucit.'],['litote : moins :: hyperbole : ?',['plus','vrai','beau','bref'],'plus','Atténuation vs amplification.'],['misanthrope : humains :: misogyne : ?',['femmes','hommes','étrangers','pauvres'],'femmes','Hostilité ciblée.'],['aporie : solution :: impasse : ?',['sortie','route','mur','voyage'],'sortie','Absence de résolution.'],['prolégomènes : ouvrage :: prolixe : ?',['discours','silence','juge','outil'],'discours','Qualificatif portant sur l’expression longue.'],['palimpseste : écriture :: strate : ?',['géologie','musique','justice','commerce'],'géologie','Objet/notion typique d’un domaine.'],['iconoclaste : tradition :: dissident : ?',['orthodoxie','voyage','économie','beauté'],'orthodoxie','Opposition à un ordre établi.'],['doxa : opinion :: épistémè : ?',['savoir','erreur','silence','image'],'savoir','Concept grec → notion associée.'],['paradoxe : évidence :: oxymore : ?',['opposition','synonyme','exemple','cause'],'opposition','Tension interne entre termes.'],['exégèse : texte :: herméneutique : ?',['interprétation','chiffre','prière','loi'],'interprétation','Discipline d’interprétation.'],['subreptice : discrétion :: ostentatoire : ?',['affichage','peur','oubli','prudence'],'affichage','Opposition caché/montré.'],['arbitraire : règle :: contingent : ?',['nécessité','hasard','durée','justice'],'nécessité','Opposition conceptuelle.'],['apocryphe : authenticité :: fallacieux : ?',['vérité','beauté','vitesse','autorité'],'vérité','Ce qui manque ou est altéré.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
