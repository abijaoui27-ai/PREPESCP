<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PrepOral — TD2 Vocabulaire</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#07070c;--surface:#0f0f18;--surface2:#16161f;--gold:#c9a96e;--text:#f0ede8;--muted:#9994aa;--border:rgba(201,169,110,.13);--blue:#0072e5;--bluebg:rgba(0,85,179,.08);--blueborder:rgba(0,85,179,.28);--green:#58d68d;--grad:linear-gradient(135deg,#c9a96e,#e8c98e,#c9a96e)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;font-size:13px;line-height:1.5}nav{position:fixed;top:0;left:0;right:0;z-index:10;padding:17px 48px;background:rgba(7,7,12,.96);border-bottom:1px solid rgba(201,169,110,.06);display:flex;align-items:center;justify-content:space-between}.logo{font-family:'Cormorant Garamond',serif;font-size:1.34rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}.nav-mid{font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);border:1px solid var(--blueborder);background:var(--bluebg);padding:5px 13px}.back{color:var(--muted);border:1px solid var(--border);padding:7px 15px;text-decoration:none;font-size:.72rem}.main{max-width:1080px;margin:auto;padding:90px 24px 52px}.hero,.panel{background:var(--surface);border:1px solid var(--border)}.hero{padding:28px 36px;margin-bottom:18px}.eyebrow{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.05rem;line-height:1;margin-bottom:9px}.muted{color:var(--muted);font-size:.78rem}.tag{font-size:.52rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);background:var(--bluebg);border:1px solid var(--blueborder);padding:5px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.panel{padding:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:var(--surface2);border:1px solid var(--border);padding:15px}.num{color:var(--gold);font-weight:700}.series{font-size:.92rem;font-weight:600;margin:10px 0;color:var(--text)}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.opt{border:1px solid rgba(201,169,110,.08);background:rgba(255,255,255,.025);padding:7px;color:var(--muted);font-size:.76rem}.corr{border-left:3px solid var(--green);background:rgba(88,214,141,.06);padding:8px 10px;color:#c9f7dc;font-size:.74rem}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.76rem}.btn{display:inline-flex;text-decoration:none;color:white;background:linear-gradient(135deg,#003b7a,#0072e5);padding:10px 18px;margin-top:12px;font-weight:600;font-size:.76rem}@media(max-width:860px){nav{padding:15px 18px}.nav-mid{display:none}.main{padding:78px 16px 36px}.hero,.panel{padding:20px 17px}.grid,.opts{grid-template-columns:1fr}}</style></head><body><nav><a href="/dashboard" class="logo">PrepOral</a><div class="nav-mid">ESSEC · TD 2</div><a href="/essec-psycho.html" class="back">← Retour</a></nav><main class="main"><section class="hero"><div class="eyebrow">Chapitre 3 — Vocabulaire</div><h1>TD 2 — Niveau ESSEC très difficile</h1><p class="muted">30 QCM premium : nuances microscopiques, faux synonymes rares, culture lexicale et pièges de registre.</p><div class="toolbar"><span class="tag">30 questions</span><span class="tag">Très difficile</span><span class="tag">Sélectif</span></div></section><section class="panel"><div id="app" class="grid"></div><a class="btn" href="/essec-psycho.html">Retour</a></section></main><script>const DATA=[['“Spécieux” signifie :',['brillant','trompeur en apparence','ancien','complexe'],'trompeur en apparence','Un raisonnement spécieux paraît convaincant mais est faux.'],['“Pusillanime” qualifie quelqu’un de :',['courageux','ambitieux','lâche','bavard'],'lâche','Pusillanime = qui manque de courage moral.'],['“Tomber en désuétude” signifie :',['devenir obligatoire','cesser d’être utilisé','être interdit','être admiré'],'cesser d’être utilisé','Une pratique en désuétude n’est plus employée.'],['Lequel est le plus soutenu ?',['parler','discuter','discourir','raconter'],'discourir','Discourir appartient au registre soutenu.'],['“Sibyllin” signifie :',['très clair','mystérieux et obscur','violent','ironique'],'mystérieux et obscur','Une phrase sibylline est difficile à interpréter.'],['“Apathie” désigne :',['la colère','l’absence d’énergie','la joie','la curiosité'],'l’absence d’énergie','Apathie = absence de réaction ou d’élan.'],['“Battre en brèche” signifie :',['renforcer','attaquer fortement','résumer','ignorer'],'attaquer fortement','On bat en brèche une théorie ou un argument.'],['“Parcimonieux” signifie :',['généreux','mesuré dans la dépense','violent','précis'],'mesuré dans la dépense','Registre soutenu proche d’économe.'],['“Lapidaire” qualifie un style :',['très long','très bref et tranchant','humoristique','confus'],'très bref et tranchant','Une réponse lapidaire est sèche et concise.'],['“Faire amende honorable” signifie :',['accuser quelqu’un','reconnaître publiquement sa faute','partir discrètement','ruser'],'reconnaître publiquement sa faute','Expression liée à la reconnaissance d’une erreur.'],['“Velléitaire” signifie :',['très motivé','qui veut sans agir','impulsif','méfiant'],'qui veut sans agir','Velléitaire = volonté faible et inefficace.'],['“Cauteleux” signifie :',['prudent et méfiant','bruyant','heureux','naïf'],'prudent et méfiant','Terme soutenu lié à la méfiance.'],['“Obvie” signifie :',['évident','faux','violent','ambigu'],'évident','Mot soutenu : ce qui saute aux yeux.'],['“Équivoque” signifie :',['ambigu','courageux','rapide','violent'],'ambigu','Équivoque implique un double sens possible.'],['“Faire chou blanc” signifie :',['réussir discrètement','échouer complètement','persévérer','tricher'],'échouer complètement','Expression idiomatique classique.'],['“Ampoulé” qualifie un style :',['sobre','prétentieux et excessif','rapide','scientifique'],'prétentieux et excessif','Un style ampoulé est artificiellement grandiloquent.'],['“Magnanimité” signifie :',['grande générosité morale','haine','prudence','lâcheté'],'grande générosité morale','Magnanimité = noblesse de caractère.'],['“Faire preuve de mansuétude” signifie :',['être indulgent','être sévère','être ironique','être absent'],'être indulgent','Mansuétude = indulgence bienveillante.'],['“Dithyrambique” signifie :',['très critique','extrêmement élogieux','très bref','scientifique'],'extrêmement élogieux','Un discours dithyrambique couvre d’éloges.'],['“Animosité” est plus fort que :',['désaccord','hostilité','violence','effroi'],'hostilité','Animosité implique une hostilité durable.'],['“Axiome” désigne :',['une preuve','un principe admis sans démonstration','une erreur','une intuition'],'un principe admis sans démonstration','Notion fondamentale du raisonnement logique.'],['“Faire fi de” implique surtout :',['la prudence','le mépris','la peur','la lenteur'],'le mépris','On ignore volontairement quelque chose.'],['“Taciturne” signifie :',['qui parle beaucoup','qui parle peu','qui hésite','qui exagère'],'qui parle peu','Taciturne = silencieux par tempérament.'],['“Emphatique” signifie :',['sobre','exagérément appuyé','discret','rationnel'],'exagérément appuyé','Ton emphatique = excessivement solennel.'],['“Fil d’Ariane” désigne :',['une menace','un guide dans une situation complexe','une erreur','une punition'],'un guide dans une situation complexe','Référence mythologique.'],['“Sophistique” qualifie un raisonnement :',['rigoureux','trompeur mais habile','scientifique','objectif'],'trompeur mais habile','Lié au sophisme.'],['“Prendre le contre-pied” signifie :',['imiter','adopter la position inverse','renoncer','résumer'],'adopter la position inverse','Opposition stratégique.'],['“Acerbe” signifie :',['doux','très mordant','flou','lent'],'très mordant','Critique acerbe = critique agressive.'],['“Dogmatique” signifie :',['ouvert au débat','attaché rigidement à ses idées','très discret','nuancé'],'attaché rigidement à ses idées','Le dogmatique refuse souvent la remise en question.'],['“Aliénation” renvoie à :',['l’émancipation','la perte d’autonomie','la richesse','la clarté'],'la perte d’autonomie','Notion fréquente en philosophie et sociologie.']];function render(){app.innerHTML=DATA.map((x,i)=>`<article class="q"><span class="num">Question ${i+1}</span><div class="series">${x[0]}</div><div class="opts">${x[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${x[2]}</strong><br>${x[3]}</div></details></article>`).join('')}render();</script></body></html>
