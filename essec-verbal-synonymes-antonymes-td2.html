<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TD 2 — Synonymes & Antonymes</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#07070c;color:#f0ede8;font-family:Outfit,sans-serif;font-size:13px;line-height:1.55}nav{position:fixed;top:0;left:0;right:0;background:#07070c;border-bottom:1px solid rgba(201,169,110,.08);padding:17px 48px;display:flex;justify-content:space-between;z-index:10}.logo{font-family:'Cormorant Garamond',serif;color:#c9a96e;text-decoration:none;font-size:1.35rem}.back{color:#9994aa;text-decoration:none;border:1px solid rgba(201,169,110,.15);padding:7px 15px}.main{max-width:1100px;margin:auto;padding:90px 24px 50px}.hero,.panel{background:#0f0f18;border:1px solid rgba(201,169,110,.13);padding:26px 34px;margin-bottom:14px}.hero h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;margin:0 0 8px}.muted{color:#9994aa}.tag{display:inline-block;color:#0072e5;border:1px solid rgba(0,85,179,.28);background:rgba(0,85,179,.08);padding:5px 8px;margin:4px 4px 4px 0;font-size:.65rem;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#16161f;border:1px solid rgba(201,169,110,.13);padding:15px}.num{color:#c9a96e;font-weight:700;margin-bottom:8px}.word{font-size:1.05rem;color:#f0ede8;font-weight:600;margin:8px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.opt{border:1px solid rgba(201,169,110,.1);padding:8px;color:#9994aa}.corr{border-left:3px solid #58d68d;background:rgba(88,214,141,.07);padding:9px;color:#c9f7dc;margin-top:10px}summary{color:#c9a96e;cursor:pointer;margin-top:10px}.btn{display:inline-block;background:linear-gradient(135deg,#003b7a,#0072e5);color:white;text-decoration:none;padding:10px 18px;margin-top:14px}@media(max-width:800px){nav{padding:15px 18px}.main{padding:78px 16px}.grid,.opts{grid-template-columns:1fr}.hero,.panel{padding:20px}}</style></head><body><nav><a class="logo" href="/dashboard">PrepOral</a><a class="back" href="/essec-psycho.html">Retour</a></nav><main class="main"><section class="hero"><span class="tag">Verbal — Chapitre 1</span><h1>TD 2 — Niveau difficile</h1><p class="muted">Nuances fines, vocabulaire soutenu et pièges lexicaux proches des vrais psychotechniques ESSEC.</p></section><section class="panel"><div id="app" class="grid"></div></section></main><script>const Q=[['Synonyme de « abscons ».',['Obscur','Rapide','Visible','Poli'],'Obscur'],['Antonyme de « prolixe ».',['Laconique','Violent','Rigide','Instable'],'Laconique'],['« Obérer » signifie :',['Accabler financièrement','Soulager','Consolider','Expliquer'],'Accabler financièrement'],['Synonyme de « sagace ».',['Perspicace','Mélancolique','Naïf','Éloquent'],'Perspicace'],['Antonyme de « circonspect ».',['Imprudent','Timide','Posé','Docile'],'Imprudent'],['« Pusillanime » désigne quelqu’un de :',['Très craintif','Très brillant','Très bavard','Très méthodique'],'Très craintif'],['Synonyme de « vindicatif ».',['Rancunier','Optimiste','Méthodique','Passif'],'Rancunier'],['Antonyme de « austère ».',['Fastueux','Stable','Concret','Ferme'],'Fastueux'],['« Consubstantiel » signifie :',['Lié par essence','Très ancien','Très visible','Temporaire'],'Lié par essence'],['Synonyme de « ineffable ».',['Indescriptible','Absurde','Négligé','Détestable'],'Indescriptible'],['« Aporie » désigne :',['Une impasse logique','Une victoire facile','Un récit imaginaire','Un ordre hiérarchique'],'Une impasse logique'],['Antonyme de « parcellaire ».',['Global','Complexe','Léger','Rigoureux'],'Global'],['Synonyme de « ignominieux ».',['Honteux','Flatteur','Précis','Abstrait'],'Honteux'],['« Prévarication » signifie :',['Abus de fonction','Erreur de calcul','Excès de vitesse','Succès inattendu'],'Abus de fonction'],['Antonyme de « taciturne ».',['Loquace','Rigide','Hostile','Opaque'],'Loquace'],['Synonyme de « dispendieux ».',['Coûteux','Fragile','Sincère','Stable'],'Coûteux'],['« Inique » signifie :',['Injuste','Invisible','Inutile','Indécis'],'Injuste'],['Antonyme de « véhément ».',['Modéré','Rapide','Subtil','Précis'],'Modéré'],['Synonyme de « sibyllin ».',['Énigmatique','Autoritaire','Rigoureux','Paisible'],'Énigmatique'],['« Dilettante » désigne une personne :',['Superficielle dans sa pratique','Très compétente','Extrêmement sévère','Très sportive'],'Superficielle dans sa pratique']];app.innerHTML=Q.map((q,i)=>`<div class="q"><div class="num">Question ${i+1}</div><div class="word">${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<div class="opt">${String.fromCharCode(65+j)}. ${o}</div>`).join('')}</div><details><summary>Voir la correction</summary><div class="corr"><strong>Réponse : ${q[2]}</strong></div></details></div>`).join('');</script></body></html>
